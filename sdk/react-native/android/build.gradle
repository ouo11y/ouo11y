// Android side of @ouo11y/react-native: the OuoReplay Expo module (dev.ouo.reactnative), which
// compiles the replay capture of sdk/android (vendored into vendor/ by scripts/sync-android.mjs,
// run by `npm run build`) and adds the gzip OTLP delivery the JavaScript outbox uses.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// The npm package's version (release-please bumps package.json only).
def packageVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).version

group = 'dev.ouo'
version = packageVersion

android {
  namespace "dev.ouo.reactnative"
  defaultConfig {
    versionCode 1
    versionName packageVersion
  }
  sourceSets {
    main {
      java.srcDirs += ['vendor']
    }
  }
}
