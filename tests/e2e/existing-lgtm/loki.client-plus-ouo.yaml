# loki.client.yaml plus ouo's ADDITIVE OTLP label promotion (docs/operations/existing-lgtm.md,
# section Loki). Nothing else differs (run.sh diffs the two files).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 1m
  retention_enabled: true
  retention_delete_delay: 1m
  delete_request_store: filesystem
  # 24h in production; 1m here so the e2e sees the delete processed.
  delete_request_cancel_period: 1m

limits_config:
  allow_structured_metadata: true
  retention_period: 336h
  deletion_mode: filter-and-delete
  # --- added for ouo ---
  otlp_config:
    resource_attributes:
      # ignore_defaults stays false: Loki's default list (service.name, service.namespace,
      # deployment.environment.name, k8s.*, cloud.*, ...) keeps working for every other sender.
      attributes_config:
        - action: index_label
          attributes:
            - ouo.platform
            - ouo.project.id
    log_attributes:
      - action: index_label
        attributes:
          - event.name
          - ouo.platform
  # --- end ---

analytics:
  reporting_enabled: false
