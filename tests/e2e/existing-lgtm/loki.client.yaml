# A customer's Loki as ouo finds it (tests/e2e/existing-lgtm): single tenant
# (auth_enabled: false), 14 days retention, compactor deletion enabled, and Loki's OWN
# default OTLP label promotion (no otlp_config at all). loki.client-plus-ouo.yaml is this
# file plus the additive block docs/operations/existing-lgtm.md asks for.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 1m
  retention_enabled: true
  retention_delete_delay: 1m
  delete_request_store: filesystem
  # 24h in production; 1m here so the e2e sees the delete processed.
  delete_request_cancel_period: 1m

limits_config:
  allow_structured_metadata: true
  retention_period: 336h
  deletion_mode: filter-and-delete

analytics:
  reporting_enabled: false
