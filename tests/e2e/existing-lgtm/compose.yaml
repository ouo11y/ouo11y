# A "client-shaped" LGTM stack for verifying docs/operations/existing-lgtm.md: the customer's
# single-tenant Loki (its own default OTLP labels, 336h retention, compactor deletion), Tempo,
# Mimir, and the customer's own OTel Collector in front. Started by run.sh under its own
# compose project; ouo (deploy/compose + compose.external.yaml) points at the published ports.
# Tempo and Mimir reuse ouo's configs: nothing in them is ouo specific.
#
#   OUO_CLIENT_LOKI_CONFIG=./loki.client.yaml docker compose -p <name> -f tests/e2e/existing-lgtm/compose.yaml up -d
services:
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["${OUO_CLIENT_LOKI_PORT:-20810}:3100"]
    volumes:
      # A path relative to this file or absolute (run.sh's multi-tenant variant).
      - ${OUO_CLIENT_LOKI_CONFIG:-./loki.client.yaml}:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/config.yaml", "-config.expand-env=true"]
    ports: ["${OUO_CLIENT_TEMPO_PORT:-20811}:3200"]
    environment:
      OUO_RETENTION_TRACES: 336h
    volumes:
      - ../../../deploy/compose/tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  mimir:
    image: grafana/mimir:3.2.1
    command: ["-config.file=/etc/mimir/config.yaml", "-config.expand-env=true"]
    ports: ["${OUO_CLIENT_MIMIR_PORT:-20812}:9009"]
    environment:
      OUO_RETENTION_METRICS: 336h
    volumes:
      - ../../../deploy/compose/mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OUO_CLIENT_OTLP_GRPC_PORT:-20813}:4317"
      - "${OUO_CLIENT_OTLP_HTTP_PORT:-20814}:4318"
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [loki, tempo, mimir]

volumes:
  loki-data:
  tempo-data:
  mimir-data:
