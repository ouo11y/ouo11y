# Continuous integration for every pull request and for pushes to main.
# Mirrors the local commands in AGENTS.md: go vet + go test per Go module, the ouo-collector
# ocb build (collector/), npm build + test across the workspaces (Node 24), the Swift core
# tests of sdk/ios on macOS, the Android build and unit tests of sdk/android on the same Mac, helm lint, an offline link check of the docs, and a build (no
# push) plus a Trivy scan of every released container image. See docs/releasing.md.
#
# Actions minutes (free org plan): the `changes` job lists the files a pull request touches
# and every other job runs only when its paths changed (macOS bills 10x, so `swift` runs only
# for sdk/ios). A push to main runs everything. A change to this file runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.paths.outputs.go }}
      collector: ${{ steps.paths.outputs.collector }}
      node: ${{ steps.paths.outputs.node }}
      swift: ${{ steps.paths.outputs.swift }}
      android: ${{ steps.paths.outputs.android }}
      helm: ${{ steps.paths.outputs.helm }}
      quickstart: ${{ steps.paths.outputs.quickstart }}
      images: ${{ steps.paths.outputs.images }}
      ex-web: ${{ steps.paths.outputs.ex-web }}
      ex-ouo-mobile: ${{ steps.paths.outputs.ex-ouo-mobile }}
      ex-sentry-mobile: ${{ steps.paths.outputs.ex-sentry-mobile }}
    steps:
      - name: Match changed files against each job's paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all=false
          files=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            all=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml' && all=true
          fi
          match() { [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          flag() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          flag go        '^(services/rum-api|examples/backend)/'
          flag collector '^(collector|deploy/compose/collector)/'
          flag node      '^(sdk|plugins|examples/ouo-web|deploy/envs)/|^package(-lock)?\.json$'
          flag swift     '^sdk/ios/'
          flag android   '^(sdk/android|sdk/react-native/android|examples/ouo-mobile/modules)/'
          flag helm      '^deploy/helm/'
          flag quickstart '^deploy/(compose/|scripts/gen-quickstart\.sh$)|^examples/quickstarts/'
          # Example smoke tests (job `examples`): the example, the shared backend and checks, the
          # SDK or receiver it exercises, and the stack they run on.
          shared='examples/(backend|tools)/|^deploy/compose/'
          flag ex-web           "^(examples/ouo-web|sdk/browser)/|^$shared"
          flag ex-ouo-mobile    "^(examples/ouo-mobile|sdk/react-native|tests/e2e/mobile|services/rum-api|collector)/|^tests/e2e/lib\.mjs$|^docs/specs/mobile-sdk\.md$|^$shared"
          flag ex-sentry-mobile "^(examples/sentry-mobile|collector)/|^$shared"
          images=""
          match '^services/rum-api/'                                        && images="$images\"rum-api\","
          match '^collector/'                                               && images="$images\"collector\","
          match '^(deploy/images/grafana|plugins/ouo11y-rum-app)/|^package-lock\.json$' && images="$images\"grafana\","
          echo "images=[${images%,}]" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Conventional commit titles feed release-please (docs/releasing.md, "Commit and PR titles").
  pr-title:
    name: PR title (conventional commit)
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 2
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|revert|deps|docs|chore|refactor|test|build|ci)(\([a-z0-9./-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title '$TITLE' is not a conventional commit: <type>(<scope>)!: <summary>, type one of feat fix perf revert deps docs chore refactor test build ci; scope = component (browser, react-native, ios, plugin, collector, rum-api, grafana, chart) when it should land in that changelog. See docs/releasing.md."
            exit 1
          fi

  # deploy/compose/quickstart.yaml follows the newest release of each image (:latest) and is
  # generated from deploy/compose at each image's release commit; fail when a newer release
  # was not regenerated (every push to main runs this, so main turns red after a release until
  # it is), the hand-written service blocks drift from the releases, the release set breaks
  # docs/compatibility.md, the in-repo pins lag, or a recorded digest no longer matches ghcr.io.
  # Needs the tags: fetch-depth 0.
  quickstart:
    name: quickstart.yaml in sync
    needs: changes
    if: needs.changes.outputs.quickstart == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read   # the ghcr.io/ouo11y image digests (public images; anonymous works too)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: deploy/scripts/gen-quickstart.sh --check --verify-digests
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # read with curl; no docker login on the shared runner
        run: deploy/scripts/gen-quickstart.sh --check --verify-digests
      - name: docker compose config
        working-directory: deploy/compose
        run: docker compose -f quickstart.yaml config --quiet
      - name: Files embedded in the quickstart guides match their source
        run: node examples/quickstarts/check-embeds.mjs

  go:
    name: go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [services/rum-api, examples/backend]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  collector:
    name: collector (ocb distribution)
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: collector/receiver/ouoreplayreceiver/go.mod
          cache-dependency-path: collector/**/go.sum
      - name: go vet + go test (ouoreplay + ouosentry receivers, ouoreplay exporter, ouoratelimit processor, ouoauth extension)
        run: |
          for m in receiver/ouoreplayreceiver receiver/ouosentryreceiver exporter/ouoreplayexporter processor/ouoratelimitprocessor extension/ouoauthextension; do
            echo "::group::$m"
            (cd "collector/$m" && go mod verify && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
      - name: Build ouo-collector with ocb (version must match the pinned components)
        working-directory: collector
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          ./dist/ouo-collector components > /dev/null
      - name: Validate the reference config
        working-directory: collector
        env:
          OUO_INGEST_TOKEN: it_ci
        run: ./dist/ouo-collector validate --config=../deploy/compose/collector/config.yaml

  # Builds each image release-images.yml publishes, from the same Dockerfile and context,
  # for linux/amd64 only (the arm64 leg runs in the release and in its dry run), loads it,
  # runs a smoke command and scans it with Trivy: fixable CRITICAL findings fail the job,
  # HIGH ones are listed. Nothing is pushed; the GHA cache is shared with the release.
  images:
    name: image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Trivy from its own image pinned by digest: no third-party action in the scan path.
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Image parameters
        id: img
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            rum-api)   echo "context=services/rum-api" >> "$GITHUB_OUTPUT"; echo "dockerfile=services/rum-api/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            collector) echo "context=collector" >> "$GITHUB_OUTPUT"; echo "dockerfile=collector/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            grafana)   echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=deploy/images/grafana/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown image $IMAGE"; exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.image == 'grafana'
        with:
          node-version: 24
          cache: npm
      - name: Build the Grafana plugin
        if: matrix.image == 'grafana'
        run: |
          npm ci
          npm run build -w plugins/ouo11y-rum-app
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: docker build (linux/amd64, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ouo-ci/${{ matrix.image }}
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            rum-api)
              docker run --rm --entrypoint /rum-api ouo-ci/rum-api -h 2>&1 | grep -q -- -check ;;
            collector)
              docker run --rm ouo-ci/collector components | grep -E 'ouoreplay|ouosentry'
              docker run --rm ouo-ci/collector --version ;;
            grafana)
              docker run --rm --entrypoint cat ouo-ci/grafana \
                /var/lib/grafana/plugins/ouo11y-rum-app/plugin.json | grep -q '"id": *"ouo11y-rum-app"' ;;
          esac
      - name: Trivy (fail on fixable CRITICAL)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          trivy() {
            # Rootless Docker on the self-hosted runners: mount the socket DOCKER_HOST points at.
            sock="${DOCKER_HOST:-unix:///var/run/docker.sock}"
            docker run --rm -v "${sock#unix://}:/var/run/docker.sock" -v "$RUNNER_TEMP/trivy:/root/.cache/" "$TRIVY" image --no-progress --scanners vuln "$@"
          }
          echo "::group::HIGH and CRITICAL (informational)"
          trivy --severity HIGH,CRITICAL --format table "ouo-ci/$IMAGE"
          echo "::endgroup::"
          trivy --skip-db-update --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "ouo-ci/$IMAGE"

  node:
    name: node (workspaces)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: build all workspaces
        run: npm run build --workspaces --if-present
      - name: "@ouo11y/browser bundle-size budget (sdk/browser/size-budget.json, checklist N10)"
        run: npm run -w sdk/browser size:check
      - name: "@ouo11y/browser compatibility: no syntax above ES2022 (es-check), entries import in Node (checklist N42)"
        run: npm run -w sdk/browser compat:check
      - name: test all workspaces
        run: npm run test --workspaces --if-present
      - name: ouo-env logic (deploy/envs, node:test, no dependencies)
        run: node --test deploy/envs/*.test.mjs
      - name: npm pack dry run (what a release would ship)
        run: |
          npm pack --dry-run -w sdk/browser
          npm pack --dry-run -w sdk/react-native

  # One stack (deploy/compose, built from this checkout) and each example's
  # scripted journey + verify, path-filtered (checklist N23 / N24). The mobile apps need an iOS
  # Simulator, which Linux runners do not have: their legs drive the same wire traffic from Linux,
  # ouo-mobile with the @ouo11y/react-native bundle in Node (sdk/react-native/playground), and
  # sentry-mobile with scripts/ci-journey.py (Sentry's headers and envelopes through the real
  # bridge); the ouo-mobile leg also runs the mobile SDK conformance suite (tests/e2e/mobile). The
  # iOS runs are scripts/run.sh on a Mac. The web leg runs the browser SDK's Playwright
# suite and the ouo-web journey in Chromium, Firefox and WebKit. About 12 minutes when everything runs.
  examples:
    name: examples (journey + verify)
    needs: changes
    if: needs.changes.outputs.ex-web == 'true' || needs.changes.outputs.ex-ouo-mobile == 'true' || needs.changes.outputs.ex-sentry-mobile == 'true'
    # Any self-hosted runner: each has its own rootless dockerd and its own host ports (OUO_*_PORT in
    # its .env, project/kb/ci-runners.md), so two stacks on two runners do not collide.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 35
    env:
      WEB: ${{ needs.changes.outputs.ex-web }}
      # mcr.microsoft.com/playwright v1.64.1-noble: must match the `playwright` / `@playwright/test` npm version.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      OUO_MOBILE: ${{ needs.changes.outputs.ex-ouo-mobile }}
      SENTRY_MOBILE: ${{ needs.changes.outputs.ex-sentry-mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: tracecheck unit tests
        run: python3 -I -m unittest discover -s examples/tools
      - name: Free disk space for the image builds
        if: runner.environment == 'github-hosted' # hosted-runner cleanup; the self-hosted runners have no sudo
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: npm ci, plugin and SDK builds
        run: |
          npm ci
          # compose.yaml bind-mounts the plugin's dist/ into Grafana (as release-check.yml does).
          npm run build -w plugins/ouo11y-rum-app
          if [ "$WEB" = true ]; then npm run -w sdk/browser build; fi
          # examples/sentry-mobile depends on @ouo11y/react-native too (file:../../sdk/react-native).
          if [ "$OUO_MOBILE" = true ] || [ "$SENTRY_MOBILE" = true ]; then npm run -w sdk/react-native build; fi
      - name: Stack URLs from this runner's ports
        run: .github/scripts/stack-env.sh | tee -a "$GITHUB_ENV"
      - name: Start the stack (built from this checkout)
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          # rum-api runs as nonroot; its bind-mounted replay directory must be writable.
          mkdir -p deploy/data/rum-api && chmod 0777 deploy/data/rum-api
          docker compose -f deploy/compose/compose.yaml up -d --build
          OUO_READY_TIMEOUT=240 deploy/scripts/wait-ready.sh
      # Cross-browser matrix (checklist N25) in this one job, no extra runners: the SDK's Playwright
      # suite against its collector stub, then the ouo-web journey + verify against the stack, in
      # Chromium, Firefox and WebKit one after the other. Both run in the Playwright image (same
      # version as the npm package, pinned by digest), which ships the three browsers and their
      # system libraries: `playwright install --with-deps` pulls ~120 MB from the Ubuntu mirror,
      # which stalled for 18 minutes and timed the job out. Host network: the stack is on localhost.
      - name: "@ouo11y/browser end to end (Playwright: Chromium, Firefox, WebKit)"
        if: env.WEB == 'true'
        timeout-minutes: 10
        run: |
          docker pull -q "$PLAYWRIGHT_IMAGE"
          docker run --rm --ipc=host --network host -e CI=true -v "$PWD:$PWD" -w "$PWD/sdk/browser" "$PLAYWRIGHT_IMAGE" \
            npx playwright test -c e2e/playwright.config.ts
      - name: ouo-web (journey + verify in Chromium, Firefox and WebKit)
        if: env.WEB == 'true'
        timeout-minutes: 12
        run: examples/ouo-web/scripts/run.sh --browsers chromium,firefox,webkit --playwright-image "$PLAYWRIGHT_IMAGE"
      - name: ouo-mobile (typecheck; @ouo11y/react-native in Node + verify)
        if: env.OUO_MOBILE == 'true'
        run: |
          (cd examples/ouo-mobile && npm ci && npx tsc --noEmit)
          start=$(( $(date +%s) - 1 ))
          for scenario in healthy errored; do
            (cd sdk/react-native && SCENARIO=$scenario OUO_OTLP="$OUO_OTLP_URL" OUO_REPLAY_ENDPOINT="$OUO_REPLAY_URL" OUO_BACKEND="$OUO_BACKEND_URL" OUO_STORAGE_FILE="$RUNNER_TEMP/rn-$scenario.json" \
              node --require ./playground/preload.cjs playground/scenario.cjs)
          done
          end=$(( $(date +%s) + 2 ))
          printf '{"start": %d, "end": %d, "backend": "%s"}\n' "$start" "$end" "$OUO_BACKEND_URL" > "$RUNNER_TEMP/rn.json"
          python3 -I examples/ouo-mobile/scripts/verify.py --journey "$RUNNER_TEMP/rn.json" --min-failed 1
      # The mobile SDK conformance suite (docs/specs/mobile-sdk.md, ADR-0015): the golden React Native
      # iOS app in Node under the native stand-in, every check asserted in rum-api, the maturity row
      # printed. Checks of packages not landed yet report without failing. It asserts rum-api and the
      # collector's receivers too, so the leg also runs on changes there.
      - name: mobile SDK conformance (React Native iOS)
        if: env.OUO_MOBILE == 'true'
        timeout-minutes: 8
        run: node tests/e2e/mobile/conformance.mjs
      - name: sentry-mobile (typecheck; Sentry wire traffic through the bridge + verify)
        if: env.SENTRY_MOBILE == 'true'
        run: |
          (cd examples/sentry-mobile && npm ci && npx tsc --noEmit)
          python3 -I examples/sentry-mobile/scripts/ci-journey.py --bridge "$OUO_SENTRY_URL" --backend "$OUO_BACKEND_URL" --out "$RUNNER_TEMP/sentry.json"
          python3 -I examples/sentry-mobile/scripts/verify.py --journey "$RUNNER_TEMP/sentry.json"
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color --tail 200

  swift:
    name: swift (OuoReplayCore)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: [self-hosted, macOS]  # the Mac runner (project/kb/ci-runners.md), only for sdk/ios changes
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: swift build (both targets, macOS stub for UIKit)
        working-directory: sdk/ios
        run: swift build
      - name: OuoReplayCore tests
        run: sh sdk/ios/test.sh
      # The macOS build above compiles the UIKit code to stubs; this compiles it for iOS.
      - name: iOS simulator build (every target, with the UIKit code and the Objective-C smoke)
        working-directory: sdk/ios
        run: xcodebuild -quiet -scheme ouo11y-ios-Package -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode build

  # Android (roadmap W9): the replay-core unit tests on the JVM, the Android library and its
  # instrumented tests compiled, and the React Native Expo module compiled inside the example app's
  # Gradle build. On the Mac runner like `swift` (the hosted runners have no budget, the Linux ones
  # no Android SDK); JDK 17 is the system Temurin, the SDK the Homebrew android-commandlinetools.
  # The emulator runs (pixel test, tests/e2e/mobile-android) stay local: one job at a time here.
  android:
    name: android (sdk/android, React Native module)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    env:
      ANDROID_HOME: /opt/homebrew/share/android-commandlinetools
      GRADLE_OPTS: -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: java -version
      - name: replay-core unit tests, the replay library and its instrumented tests compiled
        working-directory: sdk/android
        run: ./gradlew --console=plain :replay-core:test :replay:assembleRelease :replay:compileDebugAndroidTestKotlin
      - name: the Expo module compiled inside examples/ouo-mobile (prebuild, no APK)
        env:
          CI: "1"
        run: |
          npm ci
          npm run -w sdk/react-native build
          cd examples/ouo-mobile
          npm ci
          ./node_modules/.bin/expo prebuild --platform android --no-install
          cd android
          ./gradlew --console=plain :ouo11y-react-native:compileReleaseKotlin :ouo-chaos:compileReleaseKotlin -PreactNativeArchitectures=arm64-v8a

  # Every relative link in tracked Markdown and HTML must resolve (ADR-0010). Offline:
  # external URLs are not fetched, so the job is fast and never flaky. Always runs.
  links:
    name: links (lychee, offline)
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # lychee is installed once in /usr/local/bin on the self-hosted Linux runners.
      - name: lychee --offline
        run: |
          lychee --version
          lychee --offline --no-progress --exclude-path node_modules --exclude-path /dist/ './**/*.md' './**/*.html'

  helm:
    name: helm lint
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
