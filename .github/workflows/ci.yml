# Continuous integration for every pull request and for pushes to main.
# Mirrors the local commands in AGENTS.md: go vet + go test per Go module, the ouo-collector
# ocb build (collector/), npm build + test across the workspaces (Node 24), the Swift core
# tests of sdk/ios on macOS, helm lint, an offline link check of the docs, and a build (no
# push) plus a Trivy scan of every released container image. See docs/releasing.md.
#
# Actions minutes (free org plan): the `changes` job lists the files a pull request touches
# and every other job runs only when its paths changed (macOS bills 10x, so `swift` runs only
# for sdk/ios). A push to main runs everything. A change to this file runs everything.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.paths.outputs.go }}
      collector: ${{ steps.paths.outputs.collector }}
      node: ${{ steps.paths.outputs.node }}
      swift: ${{ steps.paths.outputs.swift }}
      helm: ${{ steps.paths.outputs.helm }}
      images: ${{ steps.paths.outputs.images }}
      ex-web: ${{ steps.paths.outputs.ex-web }}
      ex-ouo-mobile: ${{ steps.paths.outputs.ex-ouo-mobile }}
      ex-sentry-mobile: ${{ steps.paths.outputs.ex-sentry-mobile }}
    steps:
      - name: Match changed files against each job's paths
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all=false
          files=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            all=true
          else
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            printf '%s\n' "$files" | grep -qx '.github/workflows/ci.yml' && all=true
          fi
          match() { [ "$all" = true ] || printf '%s\n' "$files" | grep -Eq "$1"; }
          flag() { if match "$2"; then echo "$1=true"; else echo "$1=false"; fi >> "$GITHUB_OUTPUT"; }
          flag go        '^(services/rum-api|examples/backend)/'
          flag collector '^(collector|deploy/compose/collector)/'
          flag node      '^(sdk|plugins|examples/ouo-web|deploy/envs)/|^package(-lock)?\.json$'
          flag swift     '^sdk/ios/'
          flag helm      '^deploy/helm/'
          # Example smoke tests (job `examples`): the example, the shared backend and checks, the
          # SDK or receiver it exercises, and the stack they run on.
          shared='examples/(backend|tools)/|^deploy/compose/'
          flag ex-web           "^(examples/ouo-web|sdk/browser)/|^$shared"
          flag ex-ouo-mobile    "^(examples/ouo-mobile|sdk/react-native)/|^$shared"
          flag ex-sentry-mobile "^(examples/sentry-mobile|collector)/|^$shared"
          images=""
          match '^services/rum-api/'                                        && images="$images\"rum-api\","
          match '^collector/'                                               && images="$images\"collector\","
          match '^(deploy/images/grafana|plugins/ouo11y-rum-app)/|^package-lock\.json$' && images="$images\"grafana\","
          echo "images=[${images%,}]" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Conventional commit titles feed release-please (docs/releasing.md, "Commit and PR titles").
  pr-title:
    name: PR title (conventional commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|revert|deps|docs|chore|refactor|test|build|ci)(\([a-z0-9./-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title '$TITLE' is not a conventional commit: <type>(<scope>)!: <summary>, type one of feat fix perf revert deps docs chore refactor test build ci; scope = component (browser, react-native, ios, plugin, collector, rum-api, grafana, chart) when it should land in that changelog. See docs/releasing.md."
            exit 1
          fi

  go:
    name: go (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [services/rum-api, examples/backend]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  collector:
    name: collector (ocb distribution)
    needs: changes
    if: needs.changes.outputs.collector == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: collector/receiver/ouoreplayreceiver/go.mod
          cache-dependency-path: collector/**/go.sum
      - name: go vet + go test (ouoreplay + ouosentry receivers, ouoreplay exporter, ouoratelimit processor)
        run: |
          for m in receiver/ouoreplayreceiver receiver/ouosentryreceiver exporter/ouoreplayexporter processor/ouoratelimitprocessor; do
            echo "::group::$m"
            (cd "collector/$m" && go mod verify && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
      - name: Build ouo-collector with ocb (version must match the pinned components)
        working-directory: collector
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          ./dist/ouo-collector components > /dev/null
      - name: Validate the reference config
        working-directory: collector
        env:
          OUO_INGEST_TOKEN: it_ci
        run: ./dist/ouo-collector validate --config=../deploy/compose/collector/config.yaml

  # Builds each image release-images.yml publishes, from the same Dockerfile and context,
  # for linux/amd64 only (the arm64 leg runs in the release and in its dry run), loads it,
  # runs a smoke command and scans it with Trivy: fixable CRITICAL findings fail the job,
  # HIGH ones are listed. Nothing is pushed; the GHA cache is shared with the release.
  images:
    name: image (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    env:
      # Trivy from its own image pinned by digest: no third-party action in the scan path.
      TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Image parameters
        id: img
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            rum-api)   echo "context=services/rum-api" >> "$GITHUB_OUTPUT"; echo "dockerfile=services/rum-api/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            collector) echo "context=collector" >> "$GITHUB_OUTPUT"; echo "dockerfile=collector/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            grafana)   echo "context=." >> "$GITHUB_OUTPUT"; echo "dockerfile=deploy/images/grafana/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown image $IMAGE"; exit 1 ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.image == 'grafana'
        with:
          node-version: 24
          cache: npm
      - name: Build the Grafana plugin
        if: matrix.image == 'grafana'
        run: |
          npm ci
          npm run build -w plugins/ouo11y-rum-app
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: docker build (linux/amd64, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.img.outputs.context }}
          file: ${{ steps.img.outputs.dockerfile }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ouo-ci/${{ matrix.image }}
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            rum-api)
              docker run --rm --entrypoint /rum-api ouo-ci/rum-api -h 2>&1 | grep -q -- -check ;;
            collector)
              docker run --rm ouo-ci/collector components | grep -E 'ouoreplay|ouosentry'
              docker run --rm ouo-ci/collector --version ;;
            grafana)
              docker run --rm --entrypoint cat ouo-ci/grafana \
                /var/lib/grafana/plugins/ouo11y-rum-app/plugin.json | grep -q '"id": *"ouo11y-rum-app"' ;;
          esac
      - name: Trivy (fail on fixable CRITICAL)
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/" "$TRIVY" image --no-progress --scanners vuln "$@"
          }
          echo "::group::HIGH and CRITICAL (informational)"
          trivy --severity HIGH,CRITICAL --format table "ouo-ci/$IMAGE"
          echo "::endgroup::"
          trivy --skip-db-update --severity CRITICAL --ignore-unfixed --exit-code 1 --format table "ouo-ci/$IMAGE"

  node:
    name: node (workspaces)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: build all workspaces
        run: npm run build --workspaces --if-present
      - name: "@ouo11y/browser bundle-size budget (sdk/browser/size-budget.json, checklist N10)"
        run: npm run -w sdk/browser size:check
      - name: test all workspaces
        run: npm run test --workspaces --if-present
      - name: ouo-env logic (deploy/envs, node:test, no dependencies)
        run: node --test deploy/envs/*.test.mjs
      - name: npm pack dry run (what a release would ship)
        run: |
          npm pack --dry-run -w sdk/browser
          npm pack --dry-run -w sdk/react-native

  # One stack (deploy/compose, built from this checkout) and each example's
  # scripted journey + verify, path-filtered (checklist N23 / N24). The mobile apps need an iOS
  # Simulator, which Linux runners do not have: their legs drive the same wire traffic from Linux,
  # ouo-mobile with the @ouo11y/react-native bundle in Node (sdk/react-native/playground), and
  # sentry-mobile with scripts/ci-journey.py (Sentry's headers and envelopes through the real
  # bridge). The iOS runs are scripts/run.sh on a Mac. The web leg runs the browser SDK's Playwright
# suite and the ouo-web journey in Chromium, Firefox and WebKit. About 12 minutes when everything runs.
  examples:
    name: examples (journey + verify)
    needs: changes
    if: needs.changes.outputs.ex-web == 'true' || needs.changes.outputs.ex-ouo-mobile == 'true' || needs.changes.outputs.ex-sentry-mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WEB: ${{ needs.changes.outputs.ex-web }}
      OUO_MOBILE: ${{ needs.changes.outputs.ex-ouo-mobile }}
      SENTRY_MOBILE: ${{ needs.changes.outputs.ex-sentry-mobile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: tracecheck unit tests
        run: python3 -I -m unittest discover -s examples/tools
      - name: Free disk space for the image builds
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: npm ci, plugin and SDK builds
        run: |
          npm ci
          # compose.yaml bind-mounts the plugin's dist/ into Grafana (as release-check.yml does).
          npm run build -w plugins/ouo11y-rum-app
          if [ "$WEB" = true ]; then npm run -w sdk/browser build; fi
          if [ "$OUO_MOBILE" = true ]; then npm run -w sdk/react-native build; fi
      - name: Start the stack (built from this checkout)
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          # rum-api runs as nonroot; its bind-mounted replay directory must be writable.
          mkdir -p deploy/data/rum-api && chmod 0777 deploy/data/rum-api
          docker compose -f deploy/compose/compose.yaml up -d --build
          OUO_READY_TIMEOUT=240 deploy/scripts/wait-ready.sh
      # Cross-browser matrix (checklist N25) in this one job, no extra runners: the SDK's Playwright
      # suite against its collector stub, then the ouo-web journey + verify against the stack, in
      # Chromium, Firefox and WebKit one after the other.
      - name: "@ouo11y/browser end to end (Playwright: Chromium, Firefox, WebKit)"
        if: env.WEB == 'true'
        run: |
          npx -w sdk/browser playwright install --with-deps chromium firefox webkit
          npm run -w sdk/browser test:e2e
      - name: ouo-web (journey + verify in Chromium, Firefox and WebKit)
        if: env.WEB == 'true'
        run: examples/ouo-web/scripts/run.sh --browsers chromium,firefox,webkit
      - name: ouo-mobile (typecheck; @ouo11y/react-native in Node + verify)
        if: env.OUO_MOBILE == 'true'
        run: |
          (cd examples/ouo-mobile && npm ci && npx tsc --noEmit)
          start=$(( $(date +%s) - 1 ))
          for scenario in healthy errored; do
            (cd sdk/react-native && SCENARIO=$scenario OUO_BACKEND=http://localhost:8081 OUO_STORAGE_FILE="$RUNNER_TEMP/rn-$scenario.json" \
              node --require ./playground/preload.cjs playground/scenario.cjs)
          done
          end=$(( $(date +%s) + 2 ))
          printf '{"start": %d, "end": %d, "backend": "http://localhost:8081"}\n' "$start" "$end" > "$RUNNER_TEMP/rn.json"
          python3 -I examples/ouo-mobile/scripts/verify.py --journey "$RUNNER_TEMP/rn.json" --min-failed 1
      - name: sentry-mobile (typecheck; Sentry wire traffic through the bridge + verify)
        if: env.SENTRY_MOBILE == 'true'
        run: |
          (cd examples/sentry-mobile && npm ci && npx tsc --noEmit)
          python3 -I examples/sentry-mobile/scripts/ci-journey.py --out "$RUNNER_TEMP/sentry.json"
          python3 -I examples/sentry-mobile/scripts/verify.py --journey "$RUNNER_TEMP/sentry.json"
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color --tail 200

  swift:
    name: swift (OuoReplayCore)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: swift --version
      - name: swift build (both targets, macOS stub for UIKit)
        working-directory: sdk/ios
        run: swift build
      - name: OuoReplayCore tests
        run: sh sdk/ios/test.sh

  # Every relative link in tracked Markdown and HTML must resolve (ADR-0010). Offline:
  # external URLs are not fetched, so the job is fast and never flaky. Always runs.
  links:
    name: links (lychee, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: lychee --offline
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --offline --no-progress --exclude-path node_modules --exclude-path /dist/ './**/*.md' './**/*.html'
          fail: true
          jobSummary: true

  helm:
    name: helm lint
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: helm lint
        run: helm lint deploy/helm/ouo
