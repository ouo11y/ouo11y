# Continuous integration for every pull request and for pushes to main.
# Mirrors the local commands in AGENTS.md: go vet + go test per Go module, the ouo-collector
# ocb build (collector/), npm build + test
# across the workspaces (Node 24), the Swift core tests of sdk/ios on macOS, and helm lint
# when the chart exists. See docs/releasing.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/rum-api, examples/backend]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  collector:
    name: collector (ocb distribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: collector/receiver/ouoreplayreceiver/go.mod
          cache-dependency-path: collector/**/go.sum
      - name: go vet + go test (ouoreplay receiver, ouoreplay exporter, ouoratelimit processor)
        run: |
          for m in receiver/ouoreplayreceiver exporter/ouoreplayexporter processor/ouoratelimitprocessor; do
            echo "::group::$m"
            (cd "collector/$m" && go mod verify && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
      - name: Build ouo-collector with ocb (version must match the pinned components)
        working-directory: collector
        run: |
          go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
          "$(go env GOPATH)/bin/builder" --config builder.yaml
          ./dist/ouo-collector components > /dev/null
      - name: Validate the reference config
        working-directory: collector
        env:
          OUO_INGEST_TOKEN: it_ci
        run: ./dist/ouo-collector validate --config=../deploy/docker/collector/config.yaml

  node:
    name: node (workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: build all workspaces
        run: npm run build --workspaces --if-present
      - name: test all workspaces
        run: npm run test --workspaces --if-present
      - name: npm pack dry run (what a release would ship)
        run: |
          npm pack --dry-run -w sdk/browser
          npm pack --dry-run -w sdk/react-native

  swift:
    name: swift (OuoReplayCore)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift build (both targets, macOS stub for UIKit)
        working-directory: sdk/ios
        run: swift build
      - name: OuoReplayCore tests
        run: sh sdk/ios/test.sh

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect chart
        id: chart
        run: |
          if [ -f deploy/helm/ouo/Chart.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "deploy/helm/ouo/Chart.yaml not found; helm lint skipped"
          fi
      - uses: azure/setup-helm@v4
        if: steps.chart.outputs.present == 'true'
      - name: helm lint
        if: steps.chart.outputs.present == 'true'
        run: |
          helm dependency update deploy/helm/ouo || true
          helm lint deploy/helm/ouo
