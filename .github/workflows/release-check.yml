# Checks a release PR against the compatibility matrix (docs/compatibility.md) and runs the
# end-to-end scenario on the stack built from the PR head.
#
# Every release-please PR changes .github/release-please/manifest.json, so the path filter
# below selects release PRs (and PRs that edit the matrix or this check). Release PRs opened
# with GITHUB_TOKEN trigger no workflows: set RELEASE_PLEASE_TOKEN (release-please.yml) or
# run this by hand (Actions > release-check > Run workflow, branch = the release PR branch).
#
#   compat  .github/scripts/compat-check.mjs: every manifest version has a line in the matrix,
#           bounds point at existing versions, replay schema_version matches the code, chart
#           defaults point at tagged images.
#   e2e     deploy/compose stack (collector, rum-api, Grafana with the plugin, Loki, Tempo,
#           Mimir) built from this commit, then deploy/scripts/e2e.sh: the newest lines of
#           collector, rum-api and plugin together. ~10 minutes; only runs for the paths above.
name: release-check

on:
  pull_request:
    paths:
      - .github/release-please/manifest.json
      - docs/compatibility.md
      - .github/scripts/compat-check.mjs
      - .github/workflows/release-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: compatibility matrix
    runs-on: [self-hosted, Linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # tags: chart defaults must point at released images
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node .github/scripts/compat-check.mjs

  e2e:
    name: e2e scenario (stack from this commit)
    needs: compat
    # Any self-hosted runner: each has its own rootless dockerd and its own host ports (OUO_*_PORT in
    # its .env, project/kb/ci-runners.md), so two stacks on two runners do not collide.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p ouo-release-check -f deploy/compose/compose.yaml
    steps:
      # Loki stops accepting writes when its disk is over 90% full ("Ingester is shutting
      # down"), which a stock runner reaches after npm ci and the image builds. Drop the
      # preinstalled SDKs this job never uses.
      - name: Free disk space
        if: runner.environment == 'github-hosted' # hosted-runner cleanup; the self-hosted runners have no sudo
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Build the Grafana plugin (mounted into Grafana by compose.yaml)
        run: |
          npm ci
          npm run build -w plugins/ouo11y-rum-app
          rm -rf node_modules plugins/*/node_modules sdk/*/node_modules examples/*/node_modules
      - name: Stack URLs from this runner's ports
        run: .github/scripts/stack-env.sh | tee -a "$GITHUB_ENV"
      - name: Start the stack
        run: |
          # rum-api runs as nonroot; give it a writable replay directory.
          mkdir -p deploy/data/rum-api && chmod 0777 deploy/data/rum-api
          $COMPOSE up -d --build grafana loki tempo mimir otel-collector rum-api
          $COMPOSE ps
      - name: deploy/scripts/e2e.sh
        env:
          OUO_READY_TIMEOUT: '240'
        run: deploy/scripts/e2e.sh --out e2e-result.json
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-result
          path: e2e-result.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
