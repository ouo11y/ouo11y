# Checks a release PR against the compatibility matrix (docs/compatibility.md) and runs the
# end-to-end scenario on the stack built from the PR head.
#
# Every release-please PR changes .github/release-please/manifest.json, so the path filter
# below selects release PRs (and PRs that edit the matrix or this check). Release PRs opened
# with GITHUB_TOKEN trigger no workflows: set RELEASE_PLEASE_TOKEN (release-please.yml) or
# run this by hand (Actions > release-check > Run workflow, branch = the release PR branch).
#
#   compat  .github/scripts/compat-check.mjs: every manifest version has a line in the matrix,
#           bounds point at existing versions, replay schema_version matches the code, chart
#           defaults point at tagged images.
#   e2e     deploy/compose stack (collector, Muninn, MinIO, Grafana, Loki, Tempo, Mimir)
#           built from this commit, then deploy/scripts/smoke.sh: the newest lines of the
#           collector and Muninn together. ~10 minutes; only runs for the paths above.
name: release-check

on:
  pull_request:
    paths:
      - .github/release-please/manifest.json
      - docs/compatibility.md
      - .github/scripts/compat-check.mjs
      - .github/workflows/release-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: compatibility matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # tags: chart defaults must point at released images
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: node .github/scripts/compat-check.mjs

  e2e:
    name: e2e scenario (stack from this commit)
    needs: compat
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE: docker compose -p ouo-release-check -f deploy/compose/compose.yaml
    steps:
      # Loki stops accepting writes when its disk is over 90% full ("Ingester is shutting
      # down"), which a stock runner reaches after npm ci and the image builds. Drop the
      # preinstalled SDKs this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Stack URLs (compose's default ports)
        run: .github/scripts/stack-env.sh | tee -a "$GITHUB_ENV"
      - name: Start the stack
        run: |
          $COMPOSE up -d --build grafana loki tempo mimir otel-collector minio muninn-init muninn
          $COMPOSE ps
      - name: Wait for the stack, then deploy/scripts/smoke.sh
        env:
          OUO_READY_TIMEOUT: '240'
        run: deploy/scripts/wait-ready.sh && deploy/scripts/smoke.sh
      - name: Stack logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v
