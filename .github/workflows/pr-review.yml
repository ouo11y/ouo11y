# Claude reviews every pull request push and the verdict becomes the check "review" (ADR-0013).
#
#   push to a PR  -> claude-code-action reads the diff against AGENTS.md and posts ONE review
#                    whose first line is "Verdict: approve" or "Verdict: request-changes"
#   gate          -> the latest bot review on the head commit must be APPROVED, else the job fails
#
# merge-ready.yml requires this check to succeed before it merges a "ready" PR. Without the
# ANTHROPIC_API_KEY secret the job fails on purpose: no review, no merge.
# Drafts and release-please PRs are skipped (release-check.yml covers release PRs).
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: review
    if: >-
      github.event.pull_request.draft == false &&
      !startsWith(github.event.pull_request.title, 'chore(main): release')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Require the review credential
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != true ]; then
            echo "::error::ANTHROPIC_API_KEY is not set (Settings > Secrets > Actions). No review means no merge (ADR-0013)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude review
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh api repos/*/pulls/*/reviews),Bash(git log:*),Bash(git diff:*),Bash(git show:*)"
          prompt: |
            You are the automated reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }} (ADR-0013). Nobody else reviews it: your verdict decides whether it merges.

            Read AGENTS.md first: the "Before you push" list, the engineering conventions and the definition of done. Then read the PR (`gh pr view ${{ github.event.pull_request.number }}`, `gh pr diff ${{ github.event.pull_request.number }}`) and the files it touches, with as much surrounding code as you need to judge correctness.

            Judge, in this order:
            1. Correctness: bugs, wrong behaviour, broken contracts (specs under docs/specs, ADRs under docs/adr), unhandled failure modes.
            2. Safety: secrets, business material (never in this repo, AGENTS.md "Names and repos"), disabled or weakened tests, pattern kills of processes, writes outside the agent's allowed paths.
            3. The "Before you push" list: tests for the change, summary under project/agents/<agent>/summaries/, kb entry and index rows when something reusable was learned, links that resolve (the links job checks them), conventional-commit PR title.
            4. Quality: duplication, dead code, prose that does not say what the code does.

            Then post exactly ONE review with `gh pr review ${{ github.event.pull_request.number }} --approve --body "..."` or `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "..."`.
            The body's first line must be exactly `Verdict: approve` or `Verdict: request-changes`. Then a short summary and the findings, each with file and line, most severe first. Request changes for any item in 1 or 2, or for a missing summary when the PR is an agent's run. Approve otherwise; nits go in the approval body.
            Do not comment on the PR in any other way, do not edit files, do not push.

      - name: Gate on the verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq "[.[] | select(.user.type == \"Bot\") | select(.commit_id == \"$SHA\") | select(.body | test(\"^Verdict:\"))] | sort_by(.id) | last | .state // \"none\"")
          echo "latest bot verdict on $SHA: $state"
          if [ "$state" != "APPROVED" ]; then
            echo "::error::The review did not approve this head commit (state: $state). Fix the findings and push again."
            exit 1
          fi
