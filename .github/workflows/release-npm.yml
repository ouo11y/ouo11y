# Publishes @ouo11y/browser, @ouo11y/react-native or @ouo11y/kit to npmjs.org (public)
# when the founder pushes a tag.
#   browser-v0.2.0        -> sdk/browser        -> @ouo11y/browser@0.2.0
#   react-native-v0.2.0   -> sdk/react-native   -> @ouo11y/react-native@0.2.0
#   kit-v0.1.0            -> libs/ouo-kit       -> @ouo11y/kit@0.1.0
# The tag version must equal the workspace package.json version (the release PR bumps it).
#
# Every run builds, tests, packs the tarball, writes a CycloneDX SBOM (`npm sbom`) and
# SHA256SUMS. A real publish then uploads that exact tarball and attaches tarball, SBOM and
# sums to a GitHub release for the tag.
#
# Registry (founder 2026-10-24): public on npmjs.org (the SDKs are Apache-2.0), through npm
# trusted publishing: npm trusts this workflow by OIDC, so there is no NPM_TOKEN to create or
# renew. Each package lists `ouo11y/ouo11y` + `release-npm.yml` as its trusted publisher
# (npmjs.com > package > Settings). Trusted publishing needs a GitHub-hosted runner, so this
# job ignores the RUNNER variable. Provenance is added by npm once the repository is public.
#
# Dry run (publishes nothing, `npm publish --dry-run`):
#   - Actions > release-npm > Run workflow with the tag to rehearse;
#   - every pull request that changes this file (rehearses kit-v<libs/ouo-kit/package.json version>).
# A dry run of a version that is already published skips `npm publish --dry-run`, which npm
# refuses for it; a real run fails.
# Both also check, with the same token, that the registry answers for @ouo11y and that the
# version is not published yet.
name: release-npm

on:
  push:
    tags:
      - 'browser-v*'
      - 'react-native-v*'
      - 'kit-v*'
  pull_request:
    paths:
      - .github/workflows/release-npm.yml
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. browser-v0.2.0 (dry run: builds, packs, npm publish --dry-run)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-npm-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # GitHub-hosted on purpose: npm trusted publishing (OIDC) does not accept self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # gh release create
      id-token: write       # npm trusted publishing (OIDC)
    env:
      DRY_RUN: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve workspace from tag and check the version matches
        id: pkg
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)              tag="$GITHUB_REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            # A pull request rehearses @ouo11y/kit, the newest package (it also checks the kit-v* mapping).
            *)                 tag="kit-v$(node -p "require('./libs/ouo-kit/package.json').version")" ;;
          esac
          case "$tag" in
            browser-v*)      ws=sdk/browser;      version="${tag#browser-v}" ;;
            react-native-v*) ws=sdk/react-native; version="${tag#react-native-v}" ;;
            kit-v*)          ws=libs/ouo-kit;     version="${tag#kit-v}" ;;
            *) echo "::error::unexpected tag $tag"; exit 1 ;;
          esac
          name=$(node -p "require('./$ws/package.json').name")
          actual=$(node -p "require('./$ws/package.json').version")
          if [ "$actual" != "$version" ]; then
            echo "::error::tag $tag says $version but $ws/package.json says $actual"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "tag=$tag"
            echo "workspace=$ws"
            echo "name=$name"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "$name@$version from $ws (dry run: $DRY_RUN, registry: registry.npmjs.org)"

      - run: npm ci

      - name: Build and test
        env:
          WS: ${{ steps.pkg.outputs.workspace }}
        run: |
          npm run build -w "$WS"
          npm run test -w "$WS"

      - name: Pack, SBOM and checksums
        id: pack
        env:
          WS: ${{ steps.pkg.outputs.workspace }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          mkdir -p out
          # Not `npm pack --json`: prepack scripts (react-native's sync-ios) print to stdout too.
          npm pack -w "$WS" --pack-destination out
          tarball=$(cd out && ls ./*.tgz)
          tarball="${tarball#./}"
          base="${tarball%.tgz}"
          # npm sbom names the root after the monorepo; point it at the package instead.
          # shellcheck disable=SC2016 # the single-quoted part is a node script
          npm sbom -w "$WS" --omit dev --sbom-format cyclonedx \
            | node -e '
                const s = JSON.parse(require("fs").readFileSync(0));
                Object.assign(s.metadata.component, { name: process.argv[1], version: process.argv[2], "bom-ref": `${process.argv[1]}@${process.argv[2]}` });
                process.stdout.write(JSON.stringify(s, null, 2));
              ' "$NAME" "$VERSION" > "out/$base.cdx.json"
          (cd out && sha256sum ./*.tgz ./*.cdx.json > SHA256SUMS)
          cat out/SHA256SUMS
          tar -tzf "out/$tarball"
          # ./ matters: npm reads "out/x.tgz" as the GitHub shorthand owner/repo.
          echo "tarball=./out/$tarball" >> "$GITHUB_OUTPUT"

      - name: Check the registry and that the version is new
        id: registry
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          # E404 = package or version not published yet (fine); a version echo = already
          # published (versions are permanent); anything else (401/403) = token or access problem.
          if out=$(npm view "$NAME@$VERSION" version 2>&1); then
            if [ -n "$out" ]; then
              msg="$NAME@$VERSION is already published on npmjs.org"
              if [ "$DRY_RUN" = true ]; then echo "::warning::$msg (a real run would fail)"; echo "published=true" >> "$GITHUB_OUTPUT"; else echo "::error::$msg"; exit 1; fi
            else
              echo "$NAME is published, $VERSION is not: ok"
            fi
          elif echo "$out" | grep -q E404; then
            echo "$NAME@$VERSION not published yet: ok"
          else
            echo "$out"
            echo "::error::registry.npmjs.org did not answer as expected for $NAME"
            exit 1
          fi

      - name: npm publish --dry-run
        if: env.DRY_RUN == 'true' && steps.registry.outputs.published != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PRERELEASE: ${{ steps.pkg.outputs.prerelease }}
        run: |
          dist_tag=latest
          [ "$PRERELEASE" = true ] && dist_tag=next
          npm publish "$TARBALL" --dry-run --access public --tag "$dist_tag"

      - name: npm publish
        if: env.DRY_RUN != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          PRERELEASE: ${{ steps.pkg.outputs.prerelease }}
        run: |
          dist_tag=latest
          [ "$PRERELEASE" = true ] && dist_tag=next
          # Trusted publishing needs npm >= 11.5.1.
          npm install -g npm@11
          npm publish "$TARBALL" --access public --tag "$dist_tag"

      - name: Release notes
        env:
          WS: ${{ steps.pkg.outputs.workspace }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          {
            echo "npm package \`$NAME@$VERSION\` on npmjs.org."
            echo
            echo '```sh'
            echo "npm install $NAME@$VERSION"
            echo '```'
            echo
            echo "Assets: the published tarball, its CycloneDX SBOM and SHA256SUMS. Compatibility: docs/compatibility.md."
            echo
            echo "## Changes"
            echo
            .github/scripts/changelog-section.sh "$WS/CHANGELOG.md" "$VERSION"
          } > release-notes.md
          {
            if [ "$DRY_RUN" != true ]; then echo "## Published $NAME@$VERSION"; else echo "## Dry run of $NAME@$VERSION: nothing published"; fi
            echo
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub release with tarball, SBOM and checksums
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
          PRERELEASE: ${{ steps.pkg.outputs.prerelease }}
        run: |
          set -- --verify-tag --latest=false --title "$NAME $VERSION" --notes-file release-notes.md
          [ "$PRERELEASE" = true ] && set -- "$@" --prerelease
          gh release create "$TAG" "$@" out/*.tgz out/*.cdx.json out/SHA256SUMS

      - name: Keep the dry-run output
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-${{ steps.pkg.outputs.tag }}
          path: out/
          retention-days: 7
