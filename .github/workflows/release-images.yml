# Builds and pushes multi-arch container images to GHCR when an image tag is pushed.
#   rum-api-v0.2.0  -> ghcr.io/ziadmansourm/ouo/rum-api:0.2.0 (+ 0.2, latest)
#   grafana-v0.2.0  -> ghcr.io/ziadmansourm/ouo/grafana:0.2.0 (+ 0.2, latest)
# The grafana image is Grafana with the ouo-rum-app plugin baked in; it needs
# deploy/images/grafana/Dockerfile (owned by the platform-infra / helm agents) with the
# repo root as build context and plugins/ouo-rum-app/dist already built.
#
# No extra secret: GITHUB_TOKEN with packages: write is enough. The first push creates the
# package as private; make it public once in the GitHub package settings
# (see kb/release-packaging.md).
name: release-images

on:
  push:
    tags:
      - 'rum-api-v*'
      - 'grafana-v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE_PREFIX: ghcr.io/ziadmansourm/ouo

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image from tag
        id: target
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            rum-api-v*)
              image=rum-api
              context=services/rum-api
              dockerfile=services/rum-api/Dockerfile
              version="${tag#rum-api-v}"
              ;;
            grafana-v*)
              image=grafana
              context=.
              dockerfile=deploy/images/grafana/Dockerfile
              version="${tag#grafana-v}"
              ;;
            *) echo "::error::unexpected tag $tag"; exit 1 ;;
          esac
          if [ ! -f "$dockerfile" ]; then
            echo "::error::$dockerfile does not exist; nothing to build for $tag"
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "image=$image"
            echo "context=$context"
            echo "dockerfile=$dockerfile"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      # The grafana image copies the built plugin; build it first.
      - uses: actions/setup-node@v4
        if: steps.target.outputs.image == 'grafana'
        with:
          node-version: 24
          cache: npm
      - name: Build the Grafana plugin
        if: steps.target.outputs.image == 'grafana'
        run: |
          npm ci
          npm run build -w plugins/ouo-rum-app
          test -f plugins/ouo-rum-app/dist/plugin.json

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}/${{ steps.target.outputs.image }}
          tags: |
            type=raw,value=${{ steps.target.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }}
            type=raw,value=latest,enable=${{ steps.target.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=ouo ${{ steps.target.outputs.image }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.licenses=${{ steps.target.outputs.image == 'rum-api' && 'AGPL-3.0-only' || 'Apache-2.0' }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.target.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.image }}

      - name: Summary
        run: |
          {
            echo "Pushed:"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
