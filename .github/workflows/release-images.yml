# Builds and pushes multi-arch container images to GHCR when an image tag is pushed, then
# creates a GitHub release for the tag. Policy: docs/releasing.md;
# mechanics and quirks: project/kb-archive/release-packaging.md.
#
#   collector-v0.2.0       -> ghcr.io/ouo11y/collector:0.2.0 (+ 0.2, latest)
#                             ouo-collector, the ocb distribution in collector/ (otlp
#                             and ouosentry receivers); the tag must equal
#                             dist.version in collector/builder.yaml
#   muninn-v0.1.0          -> ghcr.io/ouo11y/muninn:0.1.0 (+ 0.1, latest)
#                             the replay store (ADR-0019), services/muninn
#   <image>-v0.2.0-rc.1    -> :0.2.0-rc.1 only, GitHub release marked pre-release
#   :latest moves only to the newest final version of the image (a patch to an older line
#   gets :X.Y.Z and :X.Y only)
#
# Every image is linux/amd64 + linux/arm64 with an SBOM and max-mode provenance
# attestation, OCI labels/annotations (version, revision, source) and the build args
# VERSION / REVISION (a Dockerfile that declares them can stamp the binary).
#
# Dry run: Actions > release-images > Run workflow, enter the tag you intend to push.
# It resolves, checks and builds both platforms exactly like a tag push, prints the
# release notes into the run summary, and pushes / releases nothing.
#
# No extra secret: GITHUB_TOKEN with packages: write is enough. The first push creates the
# package as private (muninn's included: the founder makes it public); collector is public since 2026-10-31 (docs/releasing.md,
# "Pull access"), and a new image package stays private until the founder makes it public.
# The ci.yml `images` job builds the same Dockerfiles on every PR that touches them and fails
# on fixable critical CVEs (Trivy).
name: release-images

on:
  push:
    tags:
      - 'collector-v*'
      - 'muninn-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to rehearse, e.g. muninn-v0.3.0-rc.1 (dry run: builds, pushes nothing)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release-images-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE_PREFIX: ghcr.io/ouo11y
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  # Put the OCI annotations on the multi-arch index too, where ghcr.io reads them.
  DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # gh release create
      packages: write   # push to ghcr.io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # release notes list the commits since the previous tag
          persist-credentials: false

      - name: Resolve image from tag
        id: target
        run: |
          case "$TAG" in
            muninn-v*)
              image=muninn
              context=services/muninn
              dockerfile=services/muninn/Dockerfile
              changelog=services/muninn/CHANGELOG.md
              paths="services/muninn"
              ;;
            collector-v*)
              image=collector
              context=collector
              dockerfile=collector/Dockerfile
              changelog=collector/CHANGELOG.md
              paths="collector"
              ;;
            *) echo "::error::unexpected tag $TAG"; exit 1 ;;
          esac
          prefix="$image-v"
          version="${TAG#"$prefix"}"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG: '$version' is not a semantic version (expected $prefix<major>.<minor>.<patch>[-rc.N])"
            exit 1
          fi
          if [ ! -f "$dockerfile" ]; then
            echo "::error::$dockerfile does not exist; nothing to build for $TAG"
            exit 1
          fi
          if [ "$image" = collector ]; then
            # ocb bakes dist.version into the binary (ouo-collector --version); keep them equal.
            built=$(awk '/^dist:/{d=1;next} d&&/^[^ ]/{d=0} d&&$1=="version:"{print $2}' collector/builder.yaml)
            if [ "$built" != "$version" ]; then
              echo "::error::$TAG says $version but collector/builder.yaml dist.version is $built"
              exit 1
            fi
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          # :latest is the newest final release, never a patch to an older line (0.4.1
          # after 0.5.0 keeps :latest on 0.5.0). deploy/compose/quickstart.yaml defaults to it.
          newest=$({ git tag -l "$prefix*"; echo "$TAG"; } | sed -n "s/^$prefix\([0-9]*\.[0-9]*\.[0-9]*\)\$/\1/p" \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          latest=false
          if [ "$prerelease" = false ] && [ "$version" = "$newest" ]; then latest=true; fi
          {
            echo "image=$image"
            echo "context=$context"
            echo "dockerfile=$dockerfile"
            echo "changelog=$changelog"
            echo "paths=$paths"
            echo "prefix=$prefix"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        if: runner.os == 'Linux'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.DRY_RUN != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY_IMAGE_PREFIX }}/${{ steps.target.outputs.image }}
          tags: |
            type=raw,value=${{ steps.target.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.target.outputs.version }}
            type=raw,value=latest,enable=${{ steps.target.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=ouo ${{ steps.target.outputs.image }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.licenses=${{ steps.target.outputs.image == 'muninn' && 'AGPL-3.0-only' || 'Apache-2.0' }}
          annotations: |
            org.opencontainers.image.title=ouo ${{ steps.target.outputs.image }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.licenses=${{ steps.target.outputs.image == 'muninn' && 'AGPL-3.0-only' || 'Apache-2.0' }}

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ steps.target.outputs.context }}
          file: ${{ steps.target.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.target.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ steps.target.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.target.outputs.image }}

      - name: Release notes
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          PREFIX: ${{ steps.target.outputs.prefix }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
          CHANGELOG: ${{ steps.target.outputs.changelog }}
          PATHS: ${{ steps.target.outputs.paths }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          ref="$REGISTRY_IMAGE_PREFIX/$IMAGE"
          # Previous tag of the same image (rc sorts before its final: versionsort.suffix).
          # A final release is compared with the previous final, skipping its own rcs.
          tags() {
            git -c versionsort.suffix=- tag --list "$PREFIX*" --sort=-v:refname \
              | { if [ "$PRERELEASE" = true ]; then cat; else grep -v -- "^${PREFIX}[0-9.]*-" || true; fi; }
          }
          prev=$(tags | awk -v t="$TAG" 'found { print; exit } $0 == t { found = 1 }')
          if [ -z "$prev" ] && ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            # Dry run of a tag that does not exist yet: the newest existing one is the previous.
            prev=$(tags | head -1)
          fi
          {
            echo "Container image \`$ref:$VERSION\` (linux/amd64, linux/arm64)."
            echo
            echo '```sh'
            echo "docker pull $ref:$VERSION"
            echo '```'
            echo
            if [ -n "$DIGEST" ]; then echo "Digest: \`$DIGEST\`"; echo; fi
            echo "SBOM and provenance attestations: \`docker buildx imagetools inspect $ref:$VERSION --format '{{ json .Provenance }}'\`."
            echo
            echo "## Changes"
            echo
            section=$(.github/scripts/changelog-section.sh "$CHANGELOG" "$VERSION")
            if [ -n "$section" ]; then
              echo "$section"
            else
              echo "_No \`## $VERSION\` section in \`$CHANGELOG\`._"
            fi
            echo
            if [ -n "$prev" ]; then
              echo "## Commits since $prev"
              echo
              # shellcheck disable=SC2086 # PATHS is a space separated list on purpose
              git log --no-merges --format='- %h %s' "$prev..HEAD" -- $PATHS
            else
              echo "First release of this image."
            fi
          } > release-notes.md
          cat release-notes.md
          {
            if [ "$DRY_RUN" = true ]; then echo "## Dry run of $TAG: nothing was pushed"; else echo "## Pushed $TAG"; fi
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            if [ "$DRY_RUN" != true ] && [ "${{ steps.target.outputs.latest }}" = true ]; then
              echo "**Next:** \`:latest\` moved, so \`deploy/compose/quickstart.yaml\` is stale (CI job \`quickstart\` fails on main until it is regenerated): bump the pins and run \`deploy/scripts/gen-quickstart.sh\` in a follow-up PR (docs/releasing.md, step 9)."
              echo
            fi
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          latest="--latest=false"   # several packages share the repo; no image release is "the" latest
          [ "${{ steps.target.outputs.prerelease }}" = true ] && prerelease="--prerelease"
          gh release create "$TAG" \
            --verify-tag \
            --title "${{ steps.target.outputs.image }} ${{ steps.target.outputs.version }}" \
            --notes-file release-notes.md \
            $prerelease $latest
