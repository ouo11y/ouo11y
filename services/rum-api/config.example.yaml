# rum-api configuration, operated like Loki and Tempo:
#
#   rum-api -config.file=/etc/rum-api/config.yaml -config.expand-env=true
#   rum-api -config.file=/etc/rum-api/config.yaml -config.expand-env=true -config.verify
#
# Order: built-in defaults < this file < environment variables. Every key below
# shows its default and, in brackets, the environment variable that overrides it
# (the variables rum-api has always read, so env-only deployments keep working).
# An environment variable set to the empty string counts as unset.
#
# -config.expand-env=true replaces ${VAR} and ${VAR:-default} with environment
# values before the YAML is parsed, so secrets stay out of the file. A bare $VAR
# is left alone; write $${ for a literal ${. Quote expanded values that may contain
# YAML syntax (": ", "#", leading "*" ...).
#
# Unknown keys are errors. -config.verify loads and validates the file, prints the
# effective configuration with secrets redacted and exits 0 (2 when invalid).

server:
  http_listen_address: ":8080"            # [RUM_API_ADDR]
  # Exact browser origins allowed besides http://localhost:* and http://127.0.0.1:*
  # (local tooling only; browsers never call rum-api in a deployment).
  cors_allowed_origins: []                # [CORS_ALLOWED_ORIGINS] comma separated

# ADR-0007 5. All three are secrets: keep them in the environment.
auth:
  # Bearer the collector's replay exporter sends on POST /v1/replay/chunks. Empty: no check.
  ingest_token: "${OUO_INGEST_TOKEN}"     # [OUO_INGEST_TOKEN]
  # Bearer Grafana's plugin proxy sends on GET / DELETE /v1/*. Empty: no check.
  read_token: "${OUO_READ_TOKEN}"         # [OUO_READ_TOKEN]
  # Bearer of the operator API /v1/admin/* (delete by user / project, audit log,
  # retention sweep; docs/operations/data-lifecycle.md). Empty: the admin API answers 404.
  admin_token: "${OUO_ADMIN_TOKEN}"       # [OUO_ADMIN_TOKEN]

loki:
  url: http://loki:3100                   # [LOKI_URL]
  datasource_uid: loki                    # [GRAFANA_LOKI_DATASOURCE_UID] Explore links
  # Submit a Loki delete request (POST /loki/api/v1/delete) for every user / project
  # deletion. Needs Loki's compactor with retention_enabled and a delete_request_store.
  delete_api: true                        # [LOKI_DELETE_API]
  funnel_cache_ttl: 60s                   # [LOKI_FUNNEL_CACHE_TTL] funnel results per definition + range; 0 disables
  # An existing, shared Loki (docs/operations/existing-lgtm.md). Sent on every request.
  tenant_id: ""                           # [LOKI_TENANT_ID] X-Scope-OrgID; empty: no header
  headers: {}                             # extra headers, e.g. {X-Api-Key: "${LOKI_API_KEY}"}; values are redacted in -config.verify
  basic_auth:                             # an authenticating gateway; empty username: none
    username: ""                          # [LOKI_BASIC_AUTH_USERNAME]
    password: ""                          # [LOKI_BASIC_AUTH_PASSWORD]
  # Base URL of POST /loki/api/v1/delete (the compactor) when url's gateway does not
  # route it there; empty: url.
  delete_url: ""                          # [LOKI_DELETE_URL]

tempo:
  url: http://tempo:3200                  # [TEMPO_URL]
  datasource_uid: tempo                   # [GRAFANA_TEMPO_DATASOURCE_UID] trace links
  concurrency: 8                          # [TEMPO_CONCURRENCY] parallel searches
  cache_ttl: 60s                          # [TEMPO_CACHE_TTL] per session + range
  tenant_id: ""                           # [TEMPO_TENANT_ID] X-Scope-OrgID; empty: no header
  headers: {}                             # extra headers on every request
  basic_auth:
    username: ""                          # [TEMPO_BASIC_AUTH_USERNAME]
    password: ""                          # [TEMPO_BASIC_AUTH_PASSWORD]

grafana:
  url: http://localhost:3000              # [GRAFANA_URL] browser-facing, for deep links

session:
  inactivity: 30m                         # [SESSION_INACTIVITY]
  max_duration: 4h                        # [SESSION_MAX_DURATION] also the list lookback
  detail_lookback: 168h                   # [SESSION_DETAIL_LOOKBACK]

limits:
  max_chunk_bytes: 4194304                # [MAX_CHUNK_BYTES] rrweb chunk
  max_frame_chunk_bytes: 8388608          # [MAX_FRAME_CHUNK_BYTES] never below max_chunk_bytes
  max_video_chunk_bytes: 8388608          # [MAX_VIDEO_CHUNK_BYTES] decoded mp4; never below max_chunk_bytes
  max_sourcemap_bytes: 67108864           # [MAX_SOURCEMAP_BYTES] one decompressed source map (ADR-0011)
  max_dsym_bytes: 536870912               # [MAX_DSYM_BYTES] one dSYM DWARF file, all architecture slices

# Symbolication of minified stacks on read (ADR-0011, docs/sourcemaps.md).
sourcemaps:
  cache_entries: 128                      # [SOURCEMAP_CACHE_ENTRIES] parsed maps and dSYMs kept per replica
  cache_bytes: 536870912                  # [SOURCEMAP_CACHE_BYTES] their decompressed size together, per replica
  cache_ttl: 10m                          # [SOURCEMAP_CACHE_TTL] other replicas see a re-upload after it

storage:
  # filesystem (default) or s3. Both keep the same layout:
  #   [<prefix>/]replays/<session_id>/<seq>.json.gz, <seq>.mp4, meta.json
  backend: filesystem                     # [STORAGE_BACKEND]
  filesystem:
    dir: /data                            # [DATA_DIR] replays live in <dir>/replays
  s3:
    # host[:port] without scheme. Empty: s3.<region>.amazonaws.com (AWS).
    endpoint: ""                          # [S3_ENDPOINT] e.g. minio:9000
    bucket: ""                            # [S3_BUCKET] required for backend s3; never created by rum-api
    region: us-east-1                     # [S3_REGION]
    # Static keys. Leave both empty to use the AWS chain (AWS_ACCESS_KEY_ID /
    # AWS_SECRET_ACCESS_KEY, MINIO_ACCESS_KEY / MINIO_SECRET_KEY, ~/.aws/credentials,
    # instance or pod role such as EKS IRSA).
    access_key_id: "${S3_ACCESS_KEY_ID}"          # [S3_ACCESS_KEY_ID]
    secret_access_key: "${S3_SECRET_ACCESS_KEY}"  # [S3_SECRET_ACCESS_KEY]
    session_token: ""                     # [S3_SESSION_TOKEN] temporary credentials only
    insecure: false                       # [S3_INSECURE] true: plain HTTP (local MinIO)
    insecure_skip_verify: false           # [S3_INSECURE_SKIP_VERIFY] TLS without certificate checks
    force_path_style: false               # [S3_FORCE_PATH_STYLE] true for MinIO and most S3 compatibles
    prefix: ""                            # [S3_PREFIX] optional, e.g. an environment or tenant
    # true: rum-api owns the bucket's ouo-replays-* lifecycle rules (one expiration rule
    # per retention below, matching the ouo-retention tag on every replay object) and
    # rewrites them at start-up. Needs s3:GetLifecycleConfiguration and
    # s3:PutLifecycleConfiguration; leave false to provision the rules yourself.
    lifecycle_rules: false                # [S3_LIFECYCLE_RULES]

# Data lifecycle (docs/operations/data-lifecycle.md). The deployment renders Loki,
# Tempo and Mimir TTLs and these from one values entry (Helm `retention`, compose
# OUO_RETENTION_*).
retention:
  replays: 720h                           # [REPLAY_RETENTION] from a session's last chunk; 0 keeps forever
  logs: 720h                              # [LOG_RETENTION] Loki's retention: how far back delete-by-user looks
  sweep_interval: 1h                      # [REPLAY_SWEEP_INTERVAL] retention sweeper; 0 disables it
  orphan_grace: 1h                        # session folders without meta.json older than this are removed
  sourcemaps: 2160h                       # [SOURCEMAP_RETENTION] from the upload; keep >= logs; 0 keeps forever

# Per-project overrides, keyed by project id (the collector's htpasswd user name).
projects: {}
#  ttltest:
#    retention:
#      replays: 24h                       # replaces retention.replays for this project
#      sourcemaps: 720h                   # replaces retention.sourcemaps for this project
#    upload_token: "${OUO_UPLOAD_TOKEN_TTLTEST}"  # SECRET source-map upload token (CI); also
#                                         # OUO_UPLOAD_TOKENS=<project>:<token>,...
#    sampling:                            # server-side cap; the replay sink drops chunks of
#      session_rate: 0.5                  # sessions outside it (same deterministic rule as
#      replay_rate: 0.1                   # the SDKs, so it keeps a subset of their sample)
#      replay_on_error_rate: 1            # error-triggered replays; a session passing either rate is kept
