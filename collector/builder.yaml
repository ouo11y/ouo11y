# OpenTelemetry Collector Builder (ocb) manifest for ouo-collector (ADR-0007).
#
#   go install go.opentelemetry.io/collector/cmd/builder@v0.160.0
#   cd collector && builder --config builder.yaml      # -> collector/dist/ouo-collector
#
# Every upstream module is pinned to the exact version the stock
# otel/opentelemetry-collector-contrib:0.160.0 image ships (`otelcol-contrib components`);
# use builder v0.160.0 to match, a newer builder rejects older component versions under
# its strict versioning check. Bump all of them together.
dist:
  module: github.com/ouo11y/ouo11y/collector/dist
  name: ouo-collector
  description: ouo OpenTelemetry Collector distribution (OTLP, replay and Sentry SDK ingest edge)
  version: 0.6.1 # x-release-please-version (release-please bumps it in the collector release PR)
  output_path: ./dist

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/basicauthextension v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.160.0
  # file_storage: the persistent, fsync-ed sending queue of the replay exporter to Muninn
  # (ADR-0019, spec COL-4; deploy/compose/collector/config.muninn.yaml).
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.160.0
  # ouoauth wraps basicauth/server and counts rejected requests (ouo_auth_failures_total).
  - gomod: github.com/ouo11y/ouo11y/collector/extension/ouoauthextension v0.0.0
  # ouoratelimit (extension): receiver middleware that charges every request with the
  # ouoratelimit processor's buckets, empty OTLP exports included. Same module as the
  # processor; ocb calls NewFactory on the import path, hence the sub-package.
  - gomod: github.com/ouo11y/ouo11y/collector/processor/ouoratelimitprocessor v0.0.0
    import: github.com/ouo11y/ouo11y/collector/processor/ouoratelimitprocessor/ouoratelimitextension

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.160.0
  - gomod: github.com/ouo11y/ouo11y/collector/receiver/ouoreplayreceiver v0.0.0
  - gomod: github.com/ouo11y/ouo11y/collector/receiver/ouosentryreceiver v0.0.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.160.0
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/attributesprocessor v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/resourceprocessor v0.160.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.160.0
  - gomod: github.com/ouo11y/ouo11y/collector/processor/ouoratelimitprocessor v0.0.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.160.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.160.0
  - gomod: github.com/ouo11y/ouo11y/collector/exporter/ouoreplayexporter v0.0.0

# routing: sends the Sentry bridge's replay chunk records (ouo.replay.chunk=true) to the
# replay pipeline and everything else to the logs pipeline (ADR-0008).
connectors:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/connector/routingconnector v0.160.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.66.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.66.0

# Our components live in this repository; the generated go.mod is in
# output_path, so the paths are relative to collector/dist.
replaces:
  - github.com/ouo11y/ouo11y/collector/extension/ouoauthextension => ../extension/ouoauthextension
  - github.com/ouo11y/ouo11y/collector/receiver/ouoreplayreceiver => ../receiver/ouoreplayreceiver
  - github.com/ouo11y/ouo11y/collector/receiver/ouosentryreceiver => ../receiver/ouosentryreceiver
  - github.com/ouo11y/ouo11y/collector/exporter/ouoreplayexporter => ../exporter/ouoreplayexporter
  - github.com/ouo11y/ouo11y/collector/processor/ouoratelimitprocessor => ../processor/ouoratelimitprocessor
