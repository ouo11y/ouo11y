# Component metadata in the mdatagen shape (documentation only; internal/metadata is hand-written).
type: ouoreplay

status:
  class: receiver
  stability:
    alpha: [logs]
  distributions: [ouo-collector]
  codeowners:
    active: [ZiadMansourM]

telemetry:
  metrics:
    ouo_replay_chunks_total:
      enabled: true
      description: Replay chunks received, by project, kind and outcome (accepted, rejected, throttled, failed).
      unit: "{chunk}"
      sum:
        value_type: int
        monotonic: true
      attributes: [ouo.project.id, ouo.replay.kind, outcome, reason]
