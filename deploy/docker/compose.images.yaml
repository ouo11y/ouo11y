# Released images instead of local builds. Override for deploy/docker/compose.yaml:
#
#   docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.images.yaml up -d
#
# rum-api, the ouo collector and Grafana (with the ouo-rum-app plugin baked in) are pulled
# from ghcr.io at the versions pinned in deploy/docker/.env (see .env.example), so no Go
# toolchain, ocb or Node build is needed and services/, collector/ and plugins/ can be
# absent. The demo backend is still built from examples/backend (it is example code, not a
# released image); delete that service when you do not need it.
#
# Build from source instead: leave this file out (compose.yaml alone builds the collector
# and rum-api and bind-mounts plugins/ouo-rum-app/dist). That is the contributor path and
# the one to use when changing services/rum-api, collector/ or the plugin.
#
# Needs Docker Compose >= 2.24 (`!reset` / `!override`). Versions and the release process:
# RELEASING.md.

services:
  otel-collector:
    build: !reset null
    image: ${OUO_IMAGE_REGISTRY:-ghcr.io/ziadmansourm/ouo}/collector:${OUO_COLLECTOR_VERSION:-0.2.0}
    pull_policy: missing

  rum-api:
    build: !reset null
    image: ${OUO_IMAGE_REGISTRY:-ghcr.io/ziadmansourm/ouo}/rum-api:${OUO_RUM_API_VERSION:-0.2.0}
    pull_policy: missing
    # rum-api 0.2.0 is the first release and includes the YAML config file + S3 / MinIO
    # replay storage (PR #19). Nothing rum-api specific is needed here: once #19 is merged,
    # compose.yaml itself starts rum-api with `-config.file=/etc/rum-api/config.yaml
    # -config.expand-env=true` and mounts ./rum-api/config.yaml, and that command and
    # mount apply to this image too (an image older than 0.2.0 exits with "flag provided
    # but not defined"). S3 / MinIO instead of the local disk: add
    # `-f deploy/docker/compose.s3.yaml` after this file (keys: STORAGE_BACKEND=s3, S3_*,
    # services/rum-api/config.example.yaml). The image ships no config.yaml of its own and
    # no baked ENV, so a mounted file is never overridden by image defaults.

  grafana:
    image: ${OUO_IMAGE_REGISTRY:-ghcr.io/ziadmansourm/ouo}/grafana:${OUO_GRAFANA_VERSION:-0.2.0}
    pull_policy: missing
    # The plugin is inside the image; drop compose.yaml's bind mount of plugins/ouo-rum-app/dist.
    volumes: !override
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
