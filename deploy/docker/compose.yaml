# ouo local observability stack (Phase 1).
# Start:  docker compose -f deploy/docker/compose.yaml up -d
# Stop:   docker compose -f deploy/docker/compose.yaml down
# Reset:  docker compose -f deploy/docker/compose.yaml down -v
# See deploy/README.md for ports and verification. Host ports can be overridden
# with OUO_*_PORT variables (deploy/docker/.env, see .env.example).

name: ouo

services:
  grafana:
    image: grafana/grafana:13.2.1
    ports:
      - "${OUO_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: ouo-rum-app
      GF_SECURITY_DISABLE_FRONTEND_SANDBOX_FOR_PLUGINS: ouo-rum-app
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
      # Phase 4: the unsigned app plugin build output (npm run -w plugins/ouo-rum-app build).
      # Short bind syntax: Docker creates an empty host dir when dist is missing, so
      # Grafana still starts (the plugin is simply absent until it is built).
      - ../../plugins/ouo-rum-app/dist:/var/lib/grafana/plugins/ouo-rum-app:ro
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Loki, Tempo, Mimir and the collector ship distroless images (no shell, no wget),
  # so they have no container healthcheck; readiness is probed over HTTP from the
  # host (deploy/scripts/smoke.sh, deploy/scripts/wait-ready.sh).
  loki:
    image: grafana/loki:3.7.7
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${OUO_LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "${OUO_TEMPO_PORT:-3200}:3200"
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  mimir:
    image: grafana/mimir:3.2.1
    command: ["-config.file=/etc/mimir/config.yaml"]
    ports:
      - "${OUO_MIMIR_PORT:-9009}:9009"
    volumes:
      - ./mimir/config.yaml:/etc/mimir/config.yaml:ro
      - mimir-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OUO_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OUO_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP (CORS enabled for browsers)
      - "${OUO_COLLECTOR_HEALTH_PORT:-13133}:13133" # health_check extension
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - loki
      - tempo
      - mimir

  backend:
    build:
      context: ../../examples/backend
    ports:
      - "${OUO_BACKEND_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: demo-backend
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - otel-collector

  # rum-api (Phase 3): replay chunk storage, session folding over Loki,
  # trace search over Tempo, JSON API for the Grafana plugin.
  rum-api:
    build:
      context: ../../services/rum-api
    ports:
      - "${OUO_RUM_API_PORT:-8080}:8080"
    environment:
      RUM_API_ADDR: ":8080"
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      # Browser-facing Grafana URL used in trace deep links.
      GRAFANA_URL: http://localhost:${OUO_GRAFANA_PORT:-3000}
      GRAFANA_TEMPO_DATASOURCE_UID: tempo
      DATA_DIR: /data
      SESSION_INACTIVITY: 30m
      SESSION_MAX_DURATION: 4h
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: rum-api
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local
    volumes:
      # Replay chunks: deploy/data/rum-api/replays/<session_id>/<seq>.json.gz (gitignored).
      - ../data/rum-api:/data
    depends_on:
      - loki
      - tempo
      - otel-collector

volumes:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
