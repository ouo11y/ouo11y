# VM / server override for deploy/docker/compose.yaml (ADR-0007, Phase 8a).
#
#   docker compose -f deploy/docker/compose.yaml -f deploy/vm/compose.tls.yaml up -d
#
# What it changes relative to the laptop stack:
#   - adds Caddy on 80/443 with automatic TLS (ACME or `tls internal`) in front of
#     Grafana (OUO_DOMAIN) and rum-api (OUO_RUM_DOMAIN); Caddyfile is ../vm/Caddyfile
#     (paths are relative to the first compose file's directory, deploy/docker)
#   - re-binds every other published port to 127.0.0.1. Docker publishes ports by
#     inserting its own iptables rules ahead of ufw, so a 0.0.0.0 binding would be
#     reachable from the internet no matter what the host firewall says. On the VM
#     only 22, 80 and 443 are open; everything else is loopback for the operator.
#   - restart: unless-stopped on every service, so `systemctl start ouo` after a
#     reboot brings the stack back (deploy/vm/ouo.service)
#   - Grafana learns its public URL and a generated admin password; rum-api builds
#     deep links to the public Grafana and trusts X-Forwarded-For from Caddy
#
# Required in deploy/docker/.env (written by deploy/vm/install.sh):
#   OUO_DOMAIN, OUO_RUM_DOMAIN, OUO_TLS, OUO_PROJECT_TOKEN, OUO_READ_TOKEN,
#   OUO_ALLOWED_ORIGINS, OUO_GRAFANA_ADMIN_PASSWORD

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      OUO_DOMAIN: ${OUO_DOMAIN:?set OUO_DOMAIN in deploy/docker/.env (Grafana hostname)}
      OUO_RUM_DOMAIN: ${OUO_RUM_DOMAIN:?set OUO_RUM_DOMAIN in deploy/docker/.env (rum-api hostname)}
      OUO_TLS: ${OUO_TLS:-internal}
    volumes:
      - ../vm/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates, ACME account, internal CA
      - caddy-config:/config
    depends_on:
      - grafana
      - rum-api

  grafana:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SERVER_ROOT_URL: https://${OUO_DOMAIN:-localhost}
      GF_SECURITY_ADMIN_PASSWORD: ${OUO_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_COOKIE_SECURE: "true"

  rum-api:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_RUM_API_PORT:-8080}:8080"
    environment:
      GRAFANA_URL: https://${OUO_DOMAIN:-localhost}
      # Caddy terminates TLS and appends the client IP to X-Forwarded-For; the per-IP
      # rate limit must see that address, not Caddy's.
      OUO_TRUST_PROXY: "true"

  loki:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_LOKI_PORT:-3100}:3100"

  tempo:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_TEMPO_PORT:-3200}:3200"

  mimir:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_MIMIR_PORT:-9009}:9009"

  otel-collector:
    restart: unless-stopped
    # ports already loopback-only in the base file

  backend:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${OUO_BACKEND_PORT:-8081}:8081"

volumes:
  caddy-data:
  caddy-config:
