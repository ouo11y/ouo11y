# The one reverse proxy for every local env (roadmap B2). Started by `ouo-env up` (or
# `ouo-env proxy up`); it reads Docker labels written by ouo-env's overlay and routes
# http://<service>.<env>.ouo.localhost (main: <service>.ouo.localhost) to the container.
# *.localhost resolves to the loopback address in browsers, curl and Node without any
# /etc/hosts edit. Dashboard: http://traefik.ouo.localhost.
#
# https on 443 for the external hosts (https://sentry.ouo.localhost, the self-hosted
# Sentry; env routes stay http): ouo-env writes a local CA, the certificate and the file-provider
# config to $OUO_ENV_STATE/proxy (default ~/.local/state/ouo-env/proxy) before it starts
# this file, so start it through `ouo-env proxy up`, not plain `docker compose`.
name: ouo-proxy

services:
  traefik:
    image: traefik:v3.7.13
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ouo-proxy
      - --providers.file.filename=/etc/ouo-proxy/dynamic.yaml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --ping=true
      - --log.level=WARN
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${OUO_PROXY_DIR:?start the proxy with deploy/envs/ouo-env proxy up}:/etc/ouo-proxy:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # external hosts (lib.mjs EXTERNAL) on Linux too
    networks:
      - ouo-proxy
    labels:
      traefik.enable: "true"
      traefik.http.routers.ouo-proxy-dashboard.rule: Host(`traefik.ouo.localhost`)
      traefik.http.routers.ouo-proxy-dashboard.entrypoints: web
      traefik.http.routers.ouo-proxy-dashboard.service: api@internal
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  ouo-proxy:
    external: true
