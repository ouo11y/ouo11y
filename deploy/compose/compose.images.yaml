# Released images instead of local builds. Override for deploy/compose/compose.yaml:
#
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.images.yaml up -d
#
# The ouo collector and Muninn are pulled from ghcr.io at the versions pinned in
# deploy/compose/.env (see .env.example), so no Go toolchain or ocb is needed and
# services/ and collector/ can be absent. Grafana, Loki, Tempo, Mimir and MinIO are stock
# upstream images either way. The demo backend is still built from examples/backend (it is
# example code, not a released image); delete that service when you do not need it.
#
# The ghcr.io/ouo11y images are public: no `docker login`. A pull that fails with `denied`
# means an old, expired ghcr.io login: `docker logout ghcr.io`.
#
# Build from source instead: leave this file out (compose.yaml alone builds the collector
# and Muninn). That is the contributor path and the one to use when changing collector/ or
# services/muninn.
#
# Pinned to the exact newest release of each image (collector 0.5.0, muninn 0.2.0);
# `deploy/scripts/gen-quickstart.sh --check` (CI job `quickstart`) fails when a newer release
# is tagged and these, .env.example and quickstart.yaml are not bumped. Collector 0.5.0 has
# the stock otlp_http, file_storage and routing components ./collector/config.yaml uses.
#
# Needs Docker Compose >= 2.24 (`!reset`). Versions and the release process: docs/releasing.md.

services:
  otel-collector:
    build: !reset null
    image: ${OUO_IMAGE_REGISTRY:-ghcr.io/ouo11y}/collector:${OUO_COLLECTOR_VERSION:-0.5.0}
    pull_policy: missing

  muninn:
    build: !reset null
    image: ${OUO_IMAGE_REGISTRY:-ghcr.io/ouo11y}/muninn:${OUO_MUNINN_VERSION:-0.2.0}
    pull_policy: missing
