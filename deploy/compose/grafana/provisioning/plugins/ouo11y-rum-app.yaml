# Enables the ouo11y RUM app plugin (plugins/ouo11y-rum-app, loaded unsigned from
# /var/lib/grafana/plugins/ouo11y-rum-app) and points its "rum" route at the
# in-network rum-api. The browser never talks to rum-api directly: the plugin
# calls /api/plugin-proxy/ouo11y-rum-app/rum/v1/... and Grafana forwards to rumApiUrl,
# adding `Authorization: Bearer <readToken>` from secureJsonData (ADR-0007 section 6).
#
# ${OUO_READ_TOKEN} is expanded by the Grafana provisioner from the container's
# environment (compose passes it through; default rt_dev_0000000000000000, a
# development value). It must equal rum-api's OUO_READ_TOKEN. Secure fields are
# write-only: the settings API reports `secureJsonFields: {readToken: true}`.
#
# The plugin's backend (the BFF, ADR-0023) reads Loki and Muninn directly. Its URLs and tenant
# default to this stack's (lokiUrl http://loki:3100, muninnUrl http://muninn:3400,
# muninnTenant anonymous; set them in jsonData elsewhere). secureJsonData.muninnReadToken is
# ${OUO_MUNINN_READ_TOKEN}, set by compose.muninn.yaml; empty without --muninn, when the
# explorer shows no replays.
# clearance maps Grafana users to Clearance levels 0-5: by login (users) first, then by
# org role (roles); anyone in neither gets 0 and sees nothing.
#
# funnels are the business flows the Business flows page counts (ADR-0025): ordered steps, a
# page step matches web pages and mobile screens by path, an event step matches an event name
# with optional conditions; the failure event (default exception) splits a drop-off into failed
# and abandoned. mimirUrl (default http://mimir:9009/prometheus) feeds the Home page's backend
# section from Tempo's span metrics.
#
# ${OUO_FEATURE_TOGGLES_ENABLE} turns plugin feature toggles on, comma separated, like
# Grafana's GF_FEATURE_TOGGLES_ENABLE (empty: all off). The list is in
# plugins/ouo11y-rum-app/README.md, e.g. OUO_FEATURE_TOGGLES_ENABLE=sessionTimelinePanel.
apiVersion: 1

apps:
  - type: ouo11y-rum-app
    org_id: 1
    disabled: false
    jsonData:
      rumApiUrl: http://rum-api:8080
      featureToggles: "${OUO_FEATURE_TOGGLES_ENABLE}"
      clearance:
        roles:
          Viewer: 1
          Editor: 3
          Admin: 5
        users: {}
      funnels:
        - id: shop-checkout
          name: Shop checkout
          description: Browse a product, add it to the cart, check out and pay, on web and mobile.
          steps:
            - { kind: page, value: /products, prefix: true, label: Product page }
            - { kind: event, value: cart.add, label: Add to cart }
            - { kind: event, value: checkout.start, label: Checkout }
            - { kind: event, value: payment.submit, label: Pay by card, where: [{ key: payment.method, value: card }] }
            - { kind: event, value: order.placed, label: Order placed }
    secureJsonData:
      readToken: ${OUO_READ_TOKEN}
      muninnReadToken: ${OUO_MUNINN_READ_TOKEN}
