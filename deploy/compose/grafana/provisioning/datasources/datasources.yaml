apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Mimir
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # OTLP log records carry the trace id as structured metadata `trace_id`.
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      lokiSearch:
        datasourceUid: loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-30m"
        spanEndTimeShift: "30m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # `${__span.tags[...]}` resolves both span attributes (session.id) and resource
        # attributes (service.name): Grafana merges process tags into __span.tags and the
        # field path goes through lodash `property`, so bracket keys with dots work.
        # session.id is structured metadata in Loki, so it is a `|` filter, never a
        # stream selector. `$$` escapes the provisioner's own ${ENV} expansion.
        tags:
          - key: service.name
            value: service_name
        query: '{service_name="$${__span.tags["service.name"]}"} | session_id="$${__span.tags["session.id"]}"'

  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      prometheusVersion: "2.9.1"
      timeInterval: 15s
      exemplarTraceIdDestination:
        - name: trace_id
          datasourceUid: tempo
