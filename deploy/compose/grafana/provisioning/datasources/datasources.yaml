apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: Mimir
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # OTLP log records carry the trace id as structured metadata `trace_id`.
        - name: TraceID
          datasourceUid: tempo
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          urlDisplayLabel: View trace

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      streamingEnabled:
        search: true
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir
      tracesToMetrics:
        datasourceUid: mimir
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
      lokiSearch:
        datasourceUid: loki
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-30m"
        spanEndTimeShift: "30m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # `${__span.tags[...]}` resolves both span attributes (session.id) and resource
        # attributes (service.name): Grafana merges process tags into __span.tags and the
        # field path goes through lodash `property`, so bracket keys with dots work.
        # session.id is structured metadata in Loki, so it is a `|` filter, never a
        # stream selector. `$$` escapes the provisioner's own ${ENV} expansion.
        tags:
          - key: service.name
            value: service_name
        query: '{service_name="$${__span.tags["service.name"]}"} | session_id="$${__span.tags["session.id"]}"'

  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Mimir
      prometheusVersion: "2.9.1"
      timeInterval: 15s
      exemplarTraceIdDestination:
        - name: trace_id
          datasourceUid: tempo

  # The ouo11y RUM app's backend (the BFF, ADR-0023): the datasource nested in the plugin.
  # The Session explorer calls its resources; the uid is fixed (BFF_DATASOURCE_UID in the
  # plugin). It reads Loki and Muninn directly: lokiUrl, muninnUrl and muninnTenant default
  # to this stack's (http://loki:3100, http://muninn:3400, anonymous).
  #
  # Clearance (ADR-0024) is the secure field `clearance`, a JSON object no user can read back:
  #   mode    "groups": the level is the highest among the user's identity-provider groups,
  #           read from the ID token Grafana forwards (oauthPassThru) and verified with `oidc`;
  #           "roles": the level comes from the Grafana org role, for a Grafana with no
  #           identity provider. Anything else: every user is level 0.
  #   groups  group name -> level 0-5        roles  Viewer / Editor / Admin -> level 0-5
  # ${OUO_CLEARANCE_MODE} is "roles" in this stack and "groups" with compose.idp.yaml, whose
  # Keycloak realm has the three groups below. ${OUO_MUNINN_READ_TOKEN} is set by
  # compose.muninn.yaml; empty without it, when the explorer shows no replays.
  - name: ouo11y
    uid: ouo11y
    type: ouo11y-rum-datasource
    access: proxy
    jsonData:
      oauthPassThru: true
      oidc:
        issuer: "${OUO_OIDC_ISSUER}"
        audience: grafana
        jwksUrl: http://keycloak:8080/realms/ouo/protocol/openid-connect/certs
    secureJsonData:
      muninnReadToken: ${OUO_MUNINN_READ_TOKEN}
      clearance: >-
        {"mode": "${OUO_CLEARANCE_MODE}",
         "groups": {"rum-support": 1, "rum-engineers": 3, "rum-privacy": 4},
         "roles": {"Viewer": 1, "Editor": 3, "Admin": 5}}
