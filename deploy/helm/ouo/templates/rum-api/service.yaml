# ClusterIP only, no Ingress (ADR-0007 section 5): rum-api is reached by the collector's
# replay exporter and by Grafana's plugin proxy, never by browsers or SDKs.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ouo.rumApi.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "rum-api") | nindent 4 }}
  {{- with .Values.rumApi.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.rumApi.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ouo.selectorLabels" (dict "root" . "component" "rum-api") | nindent 4 }}
