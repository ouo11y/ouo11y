{{- include "ouo.validate" . -}}
{{- if not .Values.rumApi.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ouo.rumApi.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "rum-api") | nindent 4 }}
type: Opaque
stringData:
  # Shared secret between the collector's replay exporter and rum-api (OUO_INGEST_TOKEN).
  ingest-token: {{ .Values.ingestToken | quote }}
  # Secret: unlocks GET/DELETE /v1/* on rum-api. Grafana reads the same key.
  read-token: {{ .Values.readToken | quote }}
  # OTEL_EXPORTER_OTLP_HEADERS for rum-api's own telemetry: Basic credential of
  # rumApi.otel.project (default the first project).
  otlp-headers: {{ include "ouo.rumApiOtlpHeaders" . | quote }}
{{- end }}
