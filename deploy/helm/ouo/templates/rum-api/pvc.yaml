{{- if and .Values.rumApi.persistence.enabled (not .Values.rumApi.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ouo.rumApi.fullname" . }}-replays
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "rum-api") | nindent 4 }}
  annotations:
    # Keep replay data across `helm uninstall`; delete the PVC explicitly to drop it.
    helm.sh/resource-policy: keep
    {{- with .Values.rumApi.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.rumApi.persistence.accessModes | nindent 4 }}
  {{- with .Values.rumApi.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rumApi.persistence.size }}
{{- end }}
