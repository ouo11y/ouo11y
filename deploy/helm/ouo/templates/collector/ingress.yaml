{{- if and .Values.collector.enabled .Values.collector.ingress.enabled }}
# One host for both public receivers: /v1/replay/* goes to the replay port 4319,
# everything else (/v1/traces, /v1/logs, /v1/metrics) to OTLP/HTTP 4318. Ingress
# controllers match the longest path first (networking.k8s.io/v1 semantics).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ouo.collector.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "collector") | nindent 4 }}
  {{- with .Values.collector.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.collector.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.collector.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.collector.ingress.host | quote }}
      secretName: {{ .Values.collector.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.collector.ingress.host | quote }}
      http:
        paths:
          - path: /v1/replay
            pathType: {{ .Values.collector.ingress.pathType }}
            backend:
              service:
                name: {{ include "ouo.collector.fullname" . }}
                port:
                  name: replay
          - path: /
            pathType: {{ .Values.collector.ingress.pathType }}
            backend:
              service:
                name: {{ include "ouo.collector.fullname" . }}
                port:
                  name: otlp-http
{{- end }}
