{{- include "ouo.validate" . -}}
{{- if and .Values.collector.enabled (not .Values.collector.existingProjectsSecret) }}
# Project registry as an htpasswd file for the collector's basicauth extension
# (ADR-0007 section 2). One `{SHA}` line per entry of `projects`, hashed in the
# template (see "ouo.htpasswdSha" in _helpers.tpl). Project tokens are public
# identifiers; the Secret keeps them out of `kubectl describe` by habit, not because
# they are secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ouo.collector.projectsSecretName" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "collector") | nindent 4 }}
type: Opaque
stringData:
  projects.htpasswd: |
    {{- include "ouo.projectsHtpasswd" . | nindent 4 }}
{{- end }}
