{{- if and .Values.collector.enabled (not .Values.muninn.existingSecret) }}
# Muninn ingest token (Muninn's auth.ingest_token) for the collector's otlp_http/muninn
# exporter, read as MUNINN_INGEST_TOKEN.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ouo.muninn.secretName" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "collector") | nindent 4 }}
type: Opaque
stringData:
  ingest-token: {{ .Values.muninn.ingestToken | quote }}
{{- end }}
