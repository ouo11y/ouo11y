{{- if .Values.collector.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ouo.collector.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "collector") | nindent 4 }}
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels:
      {{- include "ouo.selectorLabels" (dict "root" . "component" "collector") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ouo.selectorLabels" (dict "root" . "component" "collector") | nindent 8 }}
        {{- with .Values.collector.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector/configmap.yaml") . | sha256sum }}
        {{- if not .Values.collector.existingProjectsSecret }}
        checksum/projects: {{ include (print $.Template.BasePath "/collector/secret-projects.yaml") . | sha256sum }}
        {{- end }}
        {{- if not .Values.muninn.existingSecret }}
        checksum/muninn: {{ include (print $.Template.BasePath "/collector/secret-muninn.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.collector.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.collector.podSecurityContext | nindent 8 }}
      containers:
        - name: collector
          image: {{ include "ouo.image" .Values.collector.image }}
          imagePullPolicy: {{ .Values.collector.image.pullPolicy }}
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            {{- toYaml .Values.collector.containerSecurityContext | nindent 12 }}
          env:
            # Bearer the Muninn exporter sends (Muninn's auth.ingest_token).
            - name: MUNINN_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "ouo.muninn.secretName" . }}
                  key: ingest-token
            {{- with .Values.collector.allowedOrigins }}
            - name: OUO_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: OUO_RATELIMIT_CLIENT_KEY
              value: {{ include "ouo.rateLimitClientKey" . | quote }}
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: sentry
              containerPort: 4320
              protocol: TCP
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: metrics
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          volumeMounts:
            # config.yaml (ConfigMap) and projects.htpasswd (Secret) side by side.
            - name: etc-otelcol
              mountPath: /etc/otelcol
              readOnly: true
            - name: replay-queue
              mountPath: /var/lib/otelcol/replay-queue
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: etc-otelcol
          projected:
            sources:
              - configMap:
                  name: {{ include "ouo.collector.fullname" . }}
                  items:
                    - key: config.yaml
                      path: config.yaml
              - secret:
                  name: {{ include "ouo.collector.projectsSecretName" . }}
                  items:
                    - key: projects.htpasswd
                      path: projects.htpasswd
        - name: replay-queue
          {{- with .Values.collector.replayQueue.persistence }}
          {{- if .enabled }}
          persistentVolumeClaim:
            claimName: {{ .existingClaim | default (printf "%s-replay-queue" (include "ouo.collector.fullname" $)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
      {{- with .Values.collector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.collector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
