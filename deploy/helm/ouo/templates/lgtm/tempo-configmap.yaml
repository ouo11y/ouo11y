{{- if eq .Values.lgtm.mode "bundled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ouo.tempo.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "tempo") | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.lgtm.bundled.tempo.configOverride }}
    {{- .Values.lgtm.bundled.tempo.configOverride | nindent 4 }}
    {{- else }}
    # Tempo 3.x single binary, local storage, OTLP receiver, metrics generator -> Mimir
    # (mirrors deploy/compose/tempo/config.yaml; see project/kb-archive/collector-lgtm.md for the 3.x schema).
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: warn

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

    # Trace retention from .Values.retention.traces (scheduler and worker carry it in 3.0).
    backend_scheduler:
      provider:
        compaction:
          compaction:
            block_retention: {{ .Values.retention.traces }}

    backend_worker:
      compaction:
        block_retention: {{ .Values.retention.traces }}

    querier:
      frontend_worker:
        frontend_address: 127.0.0.1:9095

    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 5s

    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://{{ include "ouo.mimir.fullname" . }}:9009/api/v1/push
            send_exemplars: true

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
    {{- end }}
{{- end }}
