{{- if eq .Values.lgtm.mode "bundled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ouo.loki.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "loki") | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.lgtm.bundled.loki.configOverride }}
    {{- .Values.lgtm.bundled.loki.configOverride | nindent 4 }}
    {{- else }}
    # Loki 3.x single-binary, filesystem storage, native OTLP ingestion
    # (mirrors deploy/compose/loki/config.yaml; label promotion per ADR-0001).
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn
      # 64 MiB: a 5 000-line split of mobile records is over the 4 MiB default
      # between querier and frontend, and the query hangs (deploy/compose/loki/config.yaml).
      grpc_server_max_recv_msg_size: 67108864
      grpc_server_max_send_msg_size: 67108864

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    # Retention and deletion from .Values.retention (docs/operations/data-lifecycle.md).
    compactor:
      working_directory: /loki/compactor
      compaction_interval: {{ .Values.retention.loki.compactionInterval }}
      retention_enabled: true
      retention_delete_delay: {{ .Values.retention.loki.retentionDeleteDelay }}
      delete_request_store: filesystem
      delete_request_cancel_period: {{ .Values.retention.loki.deleteCancelPeriod }}

    pattern_ingester:
      enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      max_label_names_per_series: 30
      retention_period: {{ .Values.retention.logs }}
      deletion_mode: filter-and-delete
      {{- $streams := list }}
      {{- range $id, $p := .Values.retention.projects }}
      {{- if $p.logs }}
      {{- $streams = append $streams (dict "selector" (printf "{ouo_project_id=%q}" $id) "priority" 1 "period" (toString $p.logs)) }}
      {{- end }}
      {{- end }}
      {{- with $streams }}
      # Per-project log retention (retention.projects.<id>.logs).
      retention_stream:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes:
                - service.name
                - service.namespace
                - deployment.environment.name
                - ouo.platform
                - ouo.project.id
        log_attributes:
          - action: index_label
            attributes:
              - event.name
              - ouo.platform

    analytics:
      reporting_enabled: false
    {{- end }}
{{- end }}
