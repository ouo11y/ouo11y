{{- if eq .Values.lgtm.mode "bundled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ouo.loki.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "loki") | nindent 4 }}
data:
  config.yaml: |
    {{- if .Values.lgtm.bundled.loki.configOverride }}
    {{- .Values.lgtm.bundled.loki.configOverride | nindent 4 }}
    {{- else }}
    # Loki 3.x single-binary, filesystem storage, native OTLP ingestion
    # (mirrors deploy/compose/loki/config.yaml; label promotion per ADR-0001).
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache

    compactor:
      working_directory: /loki/compactor
      retention_enabled: false

    pattern_ingester:
      enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      max_label_names_per_series: 30
      otlp_config:
        resource_attributes:
          ignore_defaults: true
          attributes_config:
            - action: index_label
              attributes:
                - service.name
                - service.namespace
                - deployment.environment.name
                - ouo.platform
        log_attributes:
          - action: index_label
            attributes:
              - event.name
              - ouo.platform

    analytics:
      reporting_enabled: false
    {{- end }}
{{- end }}
