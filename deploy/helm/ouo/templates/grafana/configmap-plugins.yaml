{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ouo.grafana.fullname" . }}-plugins
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "grafana") | nindent 4 }}
data:
  ouo11y-rum-app.yaml: |
    # Enables the ouo11y RUM app plugin baked into the image and points its "rum" route at
    # rum-api. ${OUO_READ_TOKEN} is expanded by the Grafana provisioner from the
    # container environment (injected from the rum-api Secret), so the read token is
    # never written into this ConfigMap (ADR-0007 section 6).
    apiVersion: 1

    apps:
      - type: ouo11y-rum-app
        org_id: 1
        disabled: false
        jsonData:
          rumApiUrl: {{ include "ouo.rumApiUrl" . }}
          # From OUO_FEATURE_TOGGLES_ENABLE (grafana.plugin.featureToggles, comma separated).
          featureToggles: "${OUO_FEATURE_TOGGLES_ENABLE}"
          # The plugin's backend (ADR-0023): stores it reads, and Clearance.
          lokiUrl: {{ include "ouo.lokiUrl" . }}
          tempoUrl: {{ include "ouo.tempoUrl" . }}
          mimirUrl: {{ include "ouo.mimirPrometheusUrl" . }}
          {{- with .Values.grafana.plugin.muninnUrl }}
          muninnUrl: {{ . | trimSuffix "/" }}
          {{- end }}
          muninnTenant: {{ .Values.grafana.plugin.muninnTenant | quote }}
          clearance:
            {{- toYaml .Values.grafana.plugin.clearance | nindent 12 }}
          funnels:
            {{- toYaml .Values.grafana.plugin.funnels | nindent 12 }}
        secureJsonData:
          readToken: ${OUO_READ_TOKEN}
          muninnReadToken: ${OUO_MUNINN_READ_TOKEN}
{{- end }}
