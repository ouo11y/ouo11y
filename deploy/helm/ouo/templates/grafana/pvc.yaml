{{- if and .Values.grafana.enabled .Values.grafana.persistence.enabled (not .Values.grafana.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ouo.grafana.fullname" . }}
  labels:
    {{- include "ouo.labels" (dict "root" . "component" "grafana") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    {{- with .Values.grafana.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.grafana.persistence.accessModes | nindent 4 }}
  {{- with .Values.grafana.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size }}
{{- end }}
