# EXAMPLE ONLY, NOT VERIFIED. How a highly available ouo looks: the LGTM backends come from
# the upstream Grafana charts in replicated mode on object storage, and this chart runs
# the collector and Grafana against them (Muninn, the replay store, runs beside it). Phase 8a verified the bundled mode on
# kind; this file documents the HA path for the Phase 8 exit criterion ("install on a
# fresh Kubernetes cluster") and is the starting point for a real HA install.
#
# 1. Object storage: one S3 bucket (or GCS / Azure / MinIO) per backend. Replays live in
#    Muninn (services/muninn, ADR-0019), deployed separately with its own bucket.
#
# 2. Loki (chart grafana/loki, "simple scalable" or "distributed"):
#      helm install loki grafana/loki -n observability -f loki-values.yaml
#    loki-values.yaml (excerpt):
#      deploymentMode: SimpleScalable
#      loki:
#        auth_enabled: false
#        schemaConfig:
#          configs: [{ from: "2024-01-01", store: tsdb, object_store: s3, schema: v13, index: { prefix: index_, period: 24h } }]
#        storage: { type: s3, bucketNames: { chunks: ouo-loki, ruler: ouo-loki, admin: ouo-loki }, s3: { region: eu-central-1 } }
#        limits_config:
#          allow_structured_metadata: true
#          otlp_config:                          # the ouo label promotion (project/kb-archive/collector-lgtm.md)
#            resource_attributes:
#              ignore_defaults: true
#              attributes_config: [{ action: index_label, attributes: [service.name, service.namespace, deployment.environment.name, ouo.platform] }]
#            log_attributes: [{ action: index_label, attributes: [event.name, ouo.platform] }]
#      write: { replicas: 3 }
#      read: { replicas: 3 }
#      backend: { replicas: 3 }
#      gateway: { enabled: true }
#
# 3. Tempo (chart grafana/tempo-distributed):
#      helm install tempo grafana/tempo-distributed -n observability -f tempo-values.yaml
#    tempo-values.yaml (excerpt):
#      storage: { trace: { backend: s3, s3: { bucket: ouo-tempo, region: eu-central-1 } } }
#      traces: { otlp: { grpc: { enabled: true }, http: { enabled: true } } }
#      ingester: { replicas: 3 }
#      distributor: { replicas: 2 }
#      querier: { replicas: 2 }
#      queryFrontend: { replicas: 2 }
#      metricsGenerator:
#        enabled: true
#        config: { storage: { remote_write: [{ url: http://mimir-nginx.observability.svc:80/api/v1/push, send_exemplars: true }] } }
#      global_overrides: { metrics_generator_processors: [service-graphs, span-metrics] }
#      tempo: { structuredConfig: { stream_over_http_enabled: true } }   # Grafana search streaming
#
# 4. Mimir (chart grafana/mimir-distributed):
#      helm install mimir grafana/mimir-distributed -n observability -f mimir-values.yaml
#    mimir-values.yaml (excerpt):
#      mimir:
#        structuredConfig:
#          multitenancy_enabled: false
#          common: { storage: { backend: s3, s3: { bucket_name: ouo-mimir, region: eu-central-1 } } }
#          blocks_storage: { s3: { bucket_name: ouo-mimir-blocks } }
#          limits: { otel_metric_suffixes_enabled: false, out_of_order_time_window: 5m }
#      ingester: { replicas: 3, zoneAwareReplication: { enabled: false } }
#      distributor: { replicas: 2 }
#      querier: { replicas: 2 }
#      query_frontend: { replicas: 2 }
#      store_gateway: { replicas: 3, zoneAwareReplication: { enabled: false } }
#      nginx: { enabled: true }
#
# 5. ouo (this chart) against them:
#      helm install ouo deploy/helm/ouo -n ouo --create-namespace -f values-ha-example.yaml \
#        --set projects[0].id=web-store --set projects[0].token=pt_... \
#        --set muninn.ingestToken=mit_... --set grafana.adminPassword=...

lgtm:
  mode: external
  external:
    lokiUrl: http://loki-gateway.observability.svc:80
    tempoUrl: http://tempo-query-frontend.observability.svc:3200
    tempoOtlpGrpcEndpoint: tempo-distributor.observability.svc:4317
    mimirUrl: http://mimir-nginx.observability.svc:80

muninn:
  endpoint: http://muninn.muninn.svc:3400

# The collector is the public ingest: two replicas behind one Ingress host that routes
# /api/* to the Sentry bridge 4320 and the OTLP paths to 4318. Each replica keeps its own
# Muninn disk queue (emptyDir by default; collector.replayQueue.persistence for a PVC). The ouoratelimit buckets are per pod
# (shared state is post-MVP), so per-project limits are effectively multiplied by replicas.
collector:
  replicas: 2
  memoryLimiter: { limitMib: 1536, spikeLimitMib: 384 }
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 2Gi }
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: { app.kubernetes.io/component: collector }
  allowedOrigins:
    - https://shop.example.com
    - https://*.preview.example.com
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
    host: otel.example.com
    tls: { enabled: true, secretName: ouo-collector-tls }

# Grafana stays at one replica on SQLite. For HA Grafana set grafana.env with
# GF_DATABASE_TYPE=postgres, GF_DATABASE_HOST=..., GF_DATABASE_USER / GF_DATABASE_PASSWORD
# (through grafana.extraEnv + a Secret), disable persistence and raise replicas.
grafana:
  replicas: 1
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    host: grafana.example.com
    tls: { enabled: true, secretName: ouo-grafana-tls }
  resources:
    requests: { cpu: 250m, memory: 512Mi }

# --set projects[0].id=web-store --set projects[0].token=pt_...  (public identifier)
projects: []
