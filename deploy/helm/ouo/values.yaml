# Default values for the ouo chart.
# Every image is pinned here and can be overridden with --set <component>.image.tag=...
# See README.md for the install paths and values-kind.yaml / values-external-lgtm.yaml /
# values-ha-example.yaml for complete examples.

nameOverride: ""
fullnameOverride: ""
# The ghcr.io/ouo11y images are public and need no pull secret. For a private mirror of
# them, create a docker-registry Secret in the release namespace (README.md, "Pull access"),
# then:
# imagePullSecrets:
#   - name: <secret>
# Applied to every pod the chart runs (collector, Grafana, bundled LGTM).
imagePullSecrets: []
commonLabels: {}

# -----------------------------------------------------------------------------
# Projects (ADR-0007). The collector is the only internet-facing ingest; every
# SDK / OTLP request carries `Authorization: Basic base64("<id>:<token>")` and the
# collector's basicauth extension checks it against an htpasswd file rendered from
# this list into the Secret <release>-collector-projects (one `{SHA}` line per entry,
# computed in the template from `token`). A project token is a public identifier:
# it only grants the right to write telemetry into that project under the limits.
# Ids are unique and match ^[a-z0-9][a-z0-9._-]{0,63}$. Rotation replaces the token in
# place: upstream basicauth keeps only the last htpasswd line per username, so two
# entries with the same id cannot overlap (README.md). At least one entry (or
# collector.existingProjectsSecret) is required.
# -----------------------------------------------------------------------------
projects: []
#  - id: web-store
#    token: pt_live_9f3c...

# -----------------------------------------------------------------------------
# Muninn, the replay store (ADR-0019, docs/specs/muninn.md). This chart does not deploy
# Muninn: run it next to the chart (services/muninn) and point the collector at it. The
# collector sends replay chunks (OTLP logs, scope ouo.replay) to <endpoint>/otlp/v1/logs
# with `Authorization: Bearer <ingestToken>` and `X-Scope-OrgID: <tenant>`.
# -----------------------------------------------------------------------------
muninn:
  # Muninn base URL as seen from the collector pod, e.g. http://muninn.muninn.svc:3400.
  # Required while collector.enabled.
  endpoint: ""
  # Muninn's auth.ingest_token. Rendered into the Secret <release>-collector-muninn
  # (key `ingest-token`) unless existingSecret is set.
  ingestToken: ""
  # Pre-created Secret with key `ingest-token`. When set, ingestToken is ignored.
  existingSecret: ""
  # X-Scope-OrgID sent to Muninn: one tenant per collector (COL-9).
  tenant: anonymous

# -----------------------------------------------------------------------------
# Retention per signal (roadmap 8b, docs/operations/data-lifecycle.md): this one entry
# renders Loki's retention_period, Tempo's block_retention, Mimir's
# compactor_blocks_retention_period (bundled LGTM). Replay retention is Muninn's own
# config. Go durations in hours; Loki needs at least 24h. With lgtm.mode external, set
# the same values in your Loki / Tempo / Mimir charts (the doc lists the keys).
# -----------------------------------------------------------------------------
retention:
  logs: 720h
  traces: 336h
  metrics: 2160h
  # Per-project overrides keyed by project id: `logs` becomes a Loki retention_stream on
  # the ouo_project_id label (bundled Loki).
  # Tempo and Mimir are single-tenant here: traces and metrics have no per-project TTL.
  projects: {}
  #  ttltest:
  #    logs: 24h
  # Bundled Loki's deletion timings: a delete request can be cancelled for
  # deleteCancelPeriod before the compactor applies it; deleted chunks go after
  # retentionDeleteDelay.
  loki:
    compactionInterval: 10m
    deleteCancelPeriod: 24h
    retentionDeleteDelay: 2h

# -----------------------------------------------------------------------------
# ouo collector: the custom OpenTelemetry Collector distribution (collector/,
# image ouo/collector) and the only public ingest (ADR-0007 sections 1, 4, 7).
#   4318  OTLP/HTTP   public, Basic auth (project id : project token), CORS
#   4320  Sentry      public, Sentry DSN key auth (ouosentry receiver, ADR-0008)
#   4317  OTLP gRPC   cluster-internal only, same Basic auth (backend services)
#   13133 health, 8888 self-metrics: cluster-internal only
# Replay chunks arrive on 4318 as OTLP logs (scope ouo.replay) and go to Muninn.
# Service <release>-collector carries 4318 and 4320 (type below, Ingress optional);
# Service <release>-collector-internal (always ClusterIP) carries 4317, 13133 and 8888.
# -----------------------------------------------------------------------------
collector:
  enabled: true
  image:
    repository: ghcr.io/ouo11y/collector
    tag: "0.5.0"
    pullPolicy: IfNotPresent
  replicas: 1
  # Pre-created Secret with key `projects.htpasswd` (htpasswd lines, {SHA} or apr1,
  # never bcrypt). When set, `projects` is not rendered into a Secret.
  existingProjectsSecret: ""
  # CORS allowed origins for browser SDKs on the OTLP/HTTP receiver (OUO_ALLOWED_ORIGINS):
  # the union of all projects' origins. `*` wildcards work (https://*.example.com).
  # Empty: the reference default http://localhost:*,http://127.0.0.1:* (mobile and
  # server clients send no Origin and are unaffected either way).
  allowedOrigins: []
  #  - https://shop.example.com
  #  - https://*.preview.example.com
  limits:
    # max_request_body_size per receiver (bytes).
    otlpMaxBodyBytes: 4194304
  # Persistent queue of the Muninn exporter (file_storage, fsync on every enqueue): the
  # SDK's 2xx means "on disk". Full queue: 503 to the SDK. The directory is an emptyDir
  # unless persistence is enabled; with a PVC keep collector.replicas at 1 (ReadWriteOnce).
  replayQueue:
    sizeBytes: 2147483648
    persistence:
      enabled: false
      existingClaim: ""
      storageClass: ""
      accessModes: [ReadWriteOnce]
      size: 4Gi
  # Sentry SDK bridge (ADR-0008, docs/specs/sentry-bridge.md) on 4320: apps change only
  # their DSN host. Its video replay chunks are dropped (debug exporter) until Muninn takes them.
  sentry:
    projectId: "1"
    publicKey: publickey0000000000000000000000
    # Sentry ingest base URL the bridge forwards to, or "none".
    upstream: none
    # ouo project the bridged events are written to.
    ouoProjectId: demo
    serviceName: sentry-demo
  rateLimit:
    # ouoratelimit processor: token buckets per authenticated project and per client address.
    project:
      requestsPerSecond: 1000
      burst: 5000
    client:
      requestsPerSecond: 100
      burst: 300
      # OUO_RATELIMIT_CLIENT_KEY: `address` (TCP peer) or `x_forwarded_for` (first hop).
      # Empty: x_forwarded_for when collector.ingress.enabled, otherwise address. Use
      # x_forwarded_for only behind a proxy that overwrites the header.
      keyFrom: ""
  memoryLimiter:
    limitMib: 512
    spikeLimitMib: 128
  batch:
    timeout: 1s
    sendBatchSize: 512
    sendBatchMaxSize: 1024
  # Full collector config as a string; replaces the generated one when set.
  configOverride: ""
  service:
    # Public Service with ports 4318 (otlp-http) and 4320 (sentry). ClusterIP with an
    # Ingress, or LoadBalancer when the cluster hands out addresses.
    type: ClusterIP
    annotations: {}
  ingress:
    # Routes /api/* (Sentry envelopes) to 4320 and everything else to 4318 on one host.
    enabled: false
    className: ""
    annotations: {}
    # annotations:
    #   cert-manager.io/cluster-issuer: letsencrypt
    #   nginx.ingress.kubernetes.io/proxy-body-size: 16m
    host: otel.example.com
    pathType: Prefix
    tls:
      enabled: false
      # cert-manager fills this Secret when the annotation above is present.
      secretName: ouo-collector-tls
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Grafana (stock grafana/grafana image) with the LGTM datasources provisioned.
# -----------------------------------------------------------------------------
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "13.2.5"
    pullPolicy: IfNotPresent
  replicas: 1
  adminUser: admin
  # Required unless grafana.existingSecret is set.
  adminPassword: ""
  # Pre-created Secret with keys `admin-user` and `admin-password`.
  existingSecret: ""
  # GF_SERVER_ROOT_URL. Empty: derived from grafana.ingress when enabled.
  rootUrl: ""
  defaultTheme: dark
  anonymousEnabled: false
  # Extra GF_* environment variables (map).
  env: {}
  # Extra environment variables (list of core/v1 EnvVar).
  extraEnv: []
  datasources:
    # Provision Loki, Tempo and Mimir datasources (uids loki, tempo, mimir).
    enabled: true
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes: [ReadWriteOnce]
    size: 5Gi
    annotations: {}
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    host: grafana.example.com
    path: /
    pathType: Prefix
    tls:
      enabled: false
      secretName: ouo-grafana-tls
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits: {}
  podAnnotations: {}
  podLabels: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 0
    fsGroup: 472
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    httpGet: { path: /api/health, port: http }
    initialDelaySeconds: 20
    periodSeconds: 10
  readinessProbe:
    httpGet: { path: /api/health, port: http }
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 24

# -----------------------------------------------------------------------------
# LGTM backends.
#   bundled : single-binary Loki, Tempo and Mimir StatefulSets with the configs
#             from deploy/compose (kind, development, small installs).
#   external: nothing is deployed; the URLs below point at the customer's stack
#             (upstream grafana/loki, grafana/tempo-distributed, grafana/mimir-distributed
#             charts, Grafana Cloud, ...). See values-external-lgtm.yaml and
#             values-ha-example.yaml.
# -----------------------------------------------------------------------------
lgtm:
  mode: bundled
  external:
    # Loki HTTP base (query API and, by default, OTLP at <lokiUrl>/otlp).
    lokiUrl: http://loki-gateway.observability.svc:80
    # Tempo HTTP base (query API).
    tempoUrl: http://tempo-query-frontend.observability.svc:3200
    # Tempo OTLP gRPC receiver host:port for the collector.
    tempoOtlpGrpcEndpoint: tempo-distributor.observability.svc:4317
    # Mimir base: Grafana queries <mimirUrl>/prometheus, the collector pushes to <mimirUrl>/otlp.
    mimirUrl: http://mimir-nginx.observability.svc:80
    # Optional overrides when the write path differs from the read path.
    lokiOtlpUrl: ""
    mimirOtlpUrl: ""
    mimirPrometheusUrl: ""
    # Tenant id sent by the collector and Grafana when the external stack has
    # multitenancy enabled (X-Scope-OrgID). Empty: no header (single-tenant stack).
    tenantId: ""
  bundled:
    loki:
      image:
        repository: grafana/loki
        tag: "3.7.7"
        pullPolicy: IfNotPresent
      configOverride: ""
      persistence:
        enabled: true
        storageClass: ""
        accessModes: [ReadWriteOnce]
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits: {}
      podAnnotations: {}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector: {}
      tolerations: []
      affinity: {}
    tempo:
      image:
        repository: grafana/tempo
        tag: "3.0.3"
        pullPolicy: IfNotPresent
      configOverride: ""
      persistence:
        enabled: true
        storageClass: ""
        accessModes: [ReadWriteOnce]
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits: {}
      podAnnotations: {}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector: {}
      tolerations: []
      affinity: {}
    mimir:
      image:
        repository: grafana/mimir
        tag: "3.2.1"
        pullPolicy: IfNotPresent
      configOverride: ""
      persistence:
        enabled: true
        storageClass: ""
        accessModes: [ReadWriteOnce]
        size: 20Gi
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits: {}
      podAnnotations: {}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector: {}
      tolerations: []
      affinity: {}
