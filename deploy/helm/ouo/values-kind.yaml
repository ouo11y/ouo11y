# Values for a local kind cluster (verified in project/agents/helm/summaries/2026-10-10-phase-8a-rev2.md).
#
#   kind create cluster --name ouo-8a
#   docker build -t ouo/collector:dev collector
#   kind load docker-image ouo/collector:dev --name ouo-8a
#   # Muninn is not part of the chart: run it in the cluster (services/muninn) as a Service
#   # `muninn` on 3400 with auth.ingest_token = the token below.
#   helm install ouo deploy/helm/ouo -f deploy/helm/ouo/values-kind.yaml
#   kubectl port-forward svc/ouo-collector 4318:4318 &   # OTLP/HTTP
#   kubectl port-forward svc/ouo-grafana 13000:3000 &
#
# Development tokens shared by the whole Phase 8a stack (deploy/compose/.env.example,
# deploy/compose/collector/projects.htpasswd). They are public knowledge; never use them
# outside a laptop.
projects:
  - id: demo
    token: pt_dev_demo_0000000000000000
muninn:
  endpoint: http://muninn:3400
  ingestToken: mit_dev_0000000000000000

collector:
  image:
    repository: ouo/collector
    tag: dev
    pullPolicy: IfNotPresent   # image is loaded into the node by `kind load docker-image`
  allowedOrigins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
  resources:
    requests: { cpu: 50m, memory: 128Mi }

grafana:
  adminPassword: testing567
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }

lgtm:
  mode: bundled
  bundled:
    loki:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 128Mi } }
    tempo:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 192Mi } }
    mimir:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 256Mi } }
