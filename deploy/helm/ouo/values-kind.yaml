# Values for a local kind cluster (verified in agents/helm/summaries/2026-10-10-phase-8a-rev2.md).
#
#   kind create cluster --name ouo-8a
#   docker build -t ouo/collector:dev collector
#   docker build -t ouo/rum-api:dev services/rum-api
#   npm run -w plugins/ouo-rum-app build
#   docker build -t ouo/grafana:dev -f deploy/images/grafana/Dockerfile .
#   kind load docker-image ouo/collector:dev ouo/rum-api:dev ouo/grafana:dev --name ouo-8a
#   helm install ouo deploy/helm/ouo -f deploy/helm/ouo/values-kind.yaml
#   kubectl port-forward svc/ouo-collector 4318:4318 &   # OTLP/HTTP
#   kubectl port-forward svc/ouo-collector 4319:4319 &   # replay
#   kubectl port-forward svc/ouo-grafana 13000:3000 &
#
# Development tokens shared by the whole Phase 8a stack (deploy/docker/.env.example,
# deploy/docker/collector/projects.htpasswd). They are public knowledge; never use them
# outside a laptop.
projects:
  - id: demo
    token: pt_dev_demo_0000000000000000
ingestToken: it_dev_0000000000000000
readToken: rt_dev_0000000000000000

collector:
  image:
    repository: ouo/collector
    tag: dev
    pullPolicy: IfNotPresent   # image is loaded into the node by `kind load docker-image`
  allowedOrigins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
  resources:
    requests: { cpu: 50m, memory: 128Mi }

rumApi:
  image:
    repository: ouo/rum-api
    tag: dev
    pullPolicy: IfNotPresent
  config:
    grafanaUrl: http://localhost:13000   # the port-forward used in verification
  otel:
    environment: kind
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 64Mi }

grafana:
  image:
    repository: ouo/grafana
    tag: dev
    pullPolicy: IfNotPresent
  adminPassword: testing567
  persistence:
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }

lgtm:
  mode: bundled
  bundled:
    loki:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 128Mi } }
    tempo:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 192Mi } }
    mimir:
      persistence: { size: 2Gi }
      resources: { requests: { cpu: 50m, memory: 256Mi } }
