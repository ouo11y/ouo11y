# Install ouo next to an existing Grafana LGTM stack (the customer's Loki, Tempo and
# Mimir). What those backends need: docs/operations/existing-lgtm.md. Nothing LGTM is deployed; the collector and Grafana point at the URLs
# below. Replace the hosts with your Services (the defaults match the upstream
# grafana/loki, grafana/tempo-distributed and grafana/mimir-distributed charts installed
# in namespace `observability`).
#
#   helm install ouo deploy/helm/ouo -n ouo --create-namespace \
#     -f deploy/helm/ouo/values-external-lgtm.yaml \
#     --set projects[0].id=web-store --set projects[0].token=pt_$(openssl rand -hex 16) \
#     --set muninn.ingestToken=<Muninn auth.ingest_token> \
#     --set grafana.adminPassword=$(openssl rand -base64 18)

lgtm:
  mode: external
  external:
    lokiUrl: http://loki-gateway.observability.svc:80
    tempoUrl: http://tempo-query-frontend.observability.svc:3200
    tempoOtlpGrpcEndpoint: tempo-distributor.observability.svc:4317
    mimirUrl: http://mimir-nginx.observability.svc:80
    # Uncomment when the write path differs from the read path or the stack is multi-tenant.
    # lokiOtlpUrl: http://loki-distributor.observability.svc:3100/otlp
    # mimirOtlpUrl: http://mimir-distributor.observability.svc:8080/otlp
    # mimirPrometheusUrl: http://mimir-query-frontend.observability.svc:8080/prometheus
    # tenantId: ouo
    # Your own OTel collector in front of Loki / Tempo / Mimir: send the three writes to it
    # (OTLP gRPC for traces, OTLP/HTTP base for logs and metrics) and keep the read URLs above.
    # tempoOtlpGrpcEndpoint: otel-gateway.observability.svc:4317
    # lokiOtlpUrl: http://otel-gateway.observability.svc:4318
    # mimirOtlpUrl: http://otel-gateway.observability.svc:4318

# Public project identifiers (they ship in browser bundles): --set projects[0].token=pt_...
projects: []
#  - id: web-store
#    token: pt_live_...
muninn:
  endpoint: http://muninn.muninn.svc:3400   # Muninn is not deployed by this chart
  ingestToken: ""    # --set muninn.ingestToken=mit_...  or muninn.existingSecret

# Images: the chart's defaults (values.yaml, the release this chart version ships with);
# pin <component>.image.tag only for a private mirror or a deliberate hold-back.

collector:
  # Union of every project's browser origins.
  allowedOrigins:
    - https://shop.example.com
    - https://*.preview.example.com
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/proxy-body-size: 16m   # OTLP bodies are up to 4 MiB
    host: otel.example.com
    tls:
      enabled: true
      secretName: ouo-collector-tls

grafana:
  adminPassword: ""  # --set grafana.adminPassword=...  or grafana.existingSecret
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    host: grafana.example.com
    tls:
      enabled: true
      secretName: ouo-grafana-tls
  # Already running Grafana? Set grafana.enabled=false and add the Loki, Tempo and
  # Mimir datasources to it.
